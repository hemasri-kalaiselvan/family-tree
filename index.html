<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#243047;--mut:#65738a;--line:#dbe3ef;--pri:#234e8a;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Noto Sans Tamil","Latha",sans-serif}
a{color:inherit;text-decoration:none}
header{background:var(--pri);color:#fff;position:sticky;top:0;z-index:10}
.top{max-width:1050px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{font-weight:700;font-size:1.15rem;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:.95rem}
nav a.on{background:#ffffff30}
#who{font-size:1.3rem;padding:4px 8px;cursor:pointer;background:none;border:0;color:#fff}
main{max-width:1050px;margin:auto;padding:14px}
h2{margin:.2em 0 .6em}
.mut{color:var(--mut);font-size:.85rem}
.status{padding:10px;background:#e7eef8;border-radius:8px;margin:10px 0}
.warn{background:#fff3cd}
button,.btn{font:inherit;padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:var(--pri);color:#fff;cursor:pointer;display:inline-block}
button.alt,.btn.alt{background:#e7eef8;color:var(--pri);border-color:#b8c8e2}
button.red{background:var(--red);border-color:var(--red)}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;margin:10px 0 2px;font-size:.85rem;color:var(--mut)}
/* person card */
.pc{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:120px;max-width:100%;flex:0 1 auto}
.pc:hover{border-color:var(--pri)}
.pc{position:relative}
.pc.hb{padding-left:28px}
.bn{position:absolute;left:6px;top:50%;transform:translateY(-50%);min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:8px;background:var(--pri);color:#fff;font-size:.58rem;font-weight:700;line-height:15px;text-align:center;pointer-events:none}
.pc img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.pc .n{font-weight:600;font-size:.92rem;overflow-wrap:break-word}
.pc .t{font-size:.9rem;color:var(--ink)}
.pc .p{font-size:.8rem;color:var(--mut)}
.nw{white-space:nowrap}
.pc.ph .n{font-weight:400;color:var(--mut)}
/* tree */
.couple{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.couple .heart{color:#c2185b}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.kids{margin-left:14px;border-left:2px solid #c5d2e6;padding-left:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
/* person page */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.hero img{width:110px;height:110px;border-radius:14px;object-fit:cover}
.hero h1{margin:0;font-size:1.4rem}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.sec h3{margin:0 0 8px;font-size:1rem;color:var(--mut)}
.bl{opacity:.55;font-weight:400}
.more>summary{padding:8px 0;color:var(--pri);font-weight:600}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px}
.kv b{color:var(--mut);font-weight:500}
.kv span{overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sub{font-size:.8rem;color:var(--mut);margin-left:4px}
dialog{border:1px solid #cbd5e1;border-radius:14px;width:min(94vw,520px);max-height:90vh;color:var(--ink);padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:480px){.two{grid-template-columns:1fr}.kv{grid-template-columns:105px 1fr}}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}
.pv{width:80px;height:80px;border-radius:12px;object-fit:cover;margin-top:6px}
.mc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.88rem;line-height:1.35}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mh .nm{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.ph{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:#e3e9f3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#8a97ab}
.mc.full .ph{width:84px;height:84px;border-radius:14px;font-size:2.4rem}
.ml{margin-top:2px}.ml b{color:var(--mut);font-weight:600;font-size:.8rem}
.lk{color:var(--pri);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{white-space:nowrap;padding:5px 14px;border-radius:99px;background:#e7eef8;color:var(--pri);border:1px solid #b8c8e2;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--pri);color:#fff}
.more{display:inline-block;color:var(--pri);font-weight:700;font-size:1.1rem;line-height:1;padding:2px 8px;background:#e7eef8;border-radius:6px;margin-top:4px}
.mc details>summary{display:inline-block;color:var(--pri);font-weight:700;font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 8px;background:#e7eef8;border-radius:6px;margin-top:4px}
.mc .kv{margin-top:6px;font-size:.85rem}
#top{position:fixed;right:14px;bottom:18px;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.3rem;box-shadow:0 2px 8px #0004;z-index:20;display:none}
@media(max-width:600px){.bt{display:none}nav a{padding:8px 10px}}
.sb{position:relative}.sb input{padding-right:40px}
.qc{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font-size:1.1rem;padding:8px 12px;line-height:1}
.srow{display:flex;gap:8px;align-items:flex-start}.srow .mc{flex:1;min-width:0}
.sc{width:24px;height:24px;margin-top:14px;flex:none}
.kr{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin:0;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--ink)}
.kr input[type=checkbox]{width:20px;height:20px;padding:0;flex:none}
.kr .kn{flex:1;min-width:0}.kr .kc2{flex-basis:100%;padding-left:28px;color:var(--mut);font-size:.82rem}
.rr{padding:7px 2px;border-bottom:1px solid var(--line)}.rr .rn{font-size:.92rem;margin-bottom:3px}.rr .rn span{color:var(--mut);font-size:.8rem}
.bulk{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:25;box-shadow:0 -2px 8px #0002}
.bulk[hidden]{display:none}.bulk b{margin-right:auto;font-size:.95rem}
body.bulkon #top{bottom:82px}body.bulkon main{padding-bottom:90px}
.couple{flex-wrap:nowrap;gap:4px;align-items:stretch}
.couple .heart{flex:none;align-self:center;font-size:.9rem}
.pc{min-width:0;padding:4px 8px;gap:6px;border-radius:10px}
.pc img{width:32px;height:32px}
.pc .n{font-size:.8rem;line-height:1.2}
.pc .p{font-size:.68rem}
.kids{margin-left:10px;padding-left:8px}
.tg{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--pri);font-size:1.15rem;margin-right:8px;cursor:pointer;user-select:none;transition:transform .15s}
.tw[open]>summary .tg{transform:rotate(90deg)}
.pc.cur{border-color:var(--pri);background:#e7eef8}
.hg{margin-top:8px}.hcards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.hcards .pc{min-width:0;max-width:100%}
.hcl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;background:#eef2f9;border-radius:12px;padding:4px 6px;position:relative}
.hcl.cur{background:#dde8f7}
.hl{font-size:.72rem;color:var(--mut);text-align:center;width:100%;display:block}
.hv{height:16px;width:0;border-left:1px solid #b9c6dc;margin:0 auto}
.hgk{margin-top:12px}.hgk>summary{color:var(--pri);font-weight:600;text-align:center}
.hwrap{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding:10px 8px 16px;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:12px}
.hn{display:flex;align-items:center;width:max-content}
.hcp{display:flex;flex-direction:column;gap:1px;width:176px;flex:none}
.hcp .pc{min-width:0;width:100%}
.hcp .pc .p{white-space:nowrap;font-size:.66rem}
.hcp .heart{text-align:center;line-height:.9;font-size:.8rem;position:relative;z-index:1}
.hmore{font-size:.72rem;color:var(--pri);text-align:center;padding:2px 0;font-weight:600}
.hwrap{position:relative}
.hk{display:flex;flex-direction:column;gap:26px;margin-left:132px}
.hc{position:relative;z-index:1}
.hgrp{display:flex;flex-direction:column;gap:20px}
.hlab{font-size:.7rem;font-weight:600;color:var(--mut)}
.hsv{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden;z-index:0}
.hroots{display:flex;flex-direction:column;gap:40px;width:max-content;padding-right:56px}
.hsv.tp{z-index:2}
.hdup{font-size:.7rem;color:var(--mut);text-align:center;margin-top:2px}
/* top-down tree */
.vtw{overflow:auto;overscroll-behavior-x:contain;padding:12px 10px 18px;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:12px}
.vtr{display:inline-flex;align-items:flex-start;gap:40px;vertical-align:top;position:relative}
.vtr>svg.vl{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.vt ul{display:flex;justify-content:center;align-items:flex-start;margin:0;padding:0;list-style:none}
.vt li{position:relative;padding:44px 8px 0;text-align:center}
.vt .vtr>ul>li{padding-top:0}
.vks{display:flex;justify-content:center;align-items:flex-start;gap:24px}
.vu{display:inline-flex;align-items:center;gap:3px;position:relative;z-index:1}
.vw{color:#c2185b;font-size:.8rem}
.vt .pc{min-width:0;width:116px;padding:4px 6px;gap:5px;text-align:left}
.vt .pc img{width:28px;height:28px}
.vt .pc .n{font-size:.75rem;line-height:1.2}
.vt .pc .p{font-size:.64rem}
.zst{position:sticky;top:var(--hh,52px);z-index:9;background:var(--bg);padding:6px 0}
.zst .tools{margin:0 0 6px}
#more{font-size:1.5rem;padding:4px 10px;cursor:pointer;background:none;border:0;color:#fff;line-height:1}
#mmenu{position:fixed;top:var(--hh,52px);right:8px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0004;padding:6px;min-width:170px}
#mmenu a{display:block;padding:10px 12px;border-radius:8px;font-weight:600;color:var(--ink)}
#mmenu a:hover{background:#e7eef8}
.bnr{background:linear-gradient(135deg,#fff4e8,#ffe9f0);border:1px solid #f1c9a5;border-radius:12px;padding:8px 12px;margin:8px 0}
.bnr .bt{font-weight:700;margin-bottom:2px}
.bnr .br{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:.88rem;border-top:1px solid #f1d9c4}
.bnr .bt+.br{border-top:0}
.bnr .bx{flex:1;min-width:0;overflow-wrap:anywhere}
.bnr .bx .mut{display:block;font-size:.8rem}
.bnr .bwh{flex:none;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;line-height:1.25}
.bnr .bwh .mut{font-size:.75rem}
.bnr .bw{white-space:nowrap;color:var(--pri);font-size:.8rem}
.bnr .br.td .bw{color:#c2185b}
.bnr>.lk{display:inline-block;margin-top:4px;font-size:.85rem}
.evm{margin:16px 0 4px;color:var(--pri);font-size:1rem}
.evr{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin:4px 0;font-size:.9rem}
.evr.td{border-color:#c2185b;background:#fff0f5}
.evd{flex:none;width:28px;text-align:center;font-weight:700;color:var(--pri)}
.evi{flex:none}
.evx{flex:1;min-width:0;overflow-wrap:anywhere}
.evw{flex:none;font-size:.78rem;color:#c2185b;font-weight:600;white-space:nowrap}
.zfw.zfs{position:fixed;inset:0;z-index:60;background:var(--bg);padding:8px;overflow:hidden}
.zfs .zst{position:static}
.zfs .zw{overscroll-behavior:contain}
.zbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0}
.zbar button{padding:4px 14px;min-width:42px}
.zw{overflow:auto;height:calc(100vh - 220px);min-height:260px;background:#fff;border:1px solid var(--line);border-radius:12px;overscroll-behavior:contain;touch-action:pan-x pan-y}
.zs{position:relative}
.zi{position:absolute;left:0;top:0;transform-origin:0 0}
.zi .hwrap,.zi .vtw{overflow:visible;width:max-content;margin:0;border:0;border-radius:0}
.pc.pdup{border-color:#e8710a;box-shadow:0 0 0 1px #e8710a;background:#fff4e8}
.couple .pc.vref{border-style:dashed;font-style:italic;opacity:.85;cursor:pointer;color:var(--ink);display:block;font-size:.8rem;font-weight:600;line-height:1.2}
.couple .pc.vref b{color:#e8710a}
.couple .pc.vp{animation:vpl 1s 3}
.vt .pc.hb{padding-left:21px;width:128px}
/* left-to-right layout */
.vt.lr .vtr{flex-direction:column;align-items:flex-start;gap:30px}
.vt.lr ul{flex-direction:column;align-items:flex-start;justify-content:center}
.vt.lr li{display:flex;align-items:center;padding:6px 0 6px 44px;text-align:left}
.vt.lr .vtr>ul>li{padding-left:0}
.vt.lr .vks{flex-direction:column;align-items:flex-start;gap:14px}

.vt.lr .vw{display:block;line-height:.9}
.vt .pc .bn{left:2px;top:2px;transform:none;min-width:14px;height:14px;line-height:14px;padding:0 2px;font-size:.58rem}
.vt .vref{border-style:dashed;font-style:italic;opacity:.85;font-size:.72rem;display:block;cursor:pointer;color:var(--ink)}
.vt .vref b{color:#e8710a}
@keyframes vpl{50%{box-shadow:0 0 0 10px rgba(232,113,10,.55)}}
.vt .vc.vp .pc{animation:vpl 1s 3}
.vt .vc.vdup .pc{border-color:#e8710a;box-shadow:0 0 0 1px #e8710a;background:#fff4e8}
#vpop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px #0004;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:190px;max-width:80vw}
#vpop .vpn{font-weight:600;font-size:.85rem;color:var(--mut);padding:0 2px}
#vpop .btn,#vpop button{text-align:center;width:100%}

/* ---------- helpers ---------- */
function fmtDate(s){if(!s)return"";let m;
 if(m=String(s).match(/^--(\d{2})-(\d{2})$/))return`yyyy-${m[1]}-${m[2]}`;   /* no year: yyyy-MM-DD */
 return String(s)}   /* YYYY, YYYY-MM and YYYY-MM-DD are shown as stored */
function normTime(v){if(!v)return"";const m=String(v).trim().match(/^(\d{1,2}):(\d{2})\s*([ap]m)?$/i);if(!m)return"";let h=+m[1];const ap=(m[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;return String(h).padStart(2,"0")+":"+m[2]}
function fmtTime(v){const t=normTime(v);if(!t)return String(v||"");let[h,mi]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(mi).padStart(2,"0")+" "+ap}

 if(b)return isLate(p)?`${n(b)} – ?`:n(b);
 if(d)return`d. ${n(d)}`;return""}
function period(p){const b=fmtDate(p.dob),d=fmtDate(p.dod);
 if(b&&d)return`${b} – ${d}`;
 if(b)return isLate(p)?`${b} – ?`:b;
 if(d)return`d. ${d}`;return""}
const sortKey=p=>dispName(p).replace(/^\s*late\s+/i,"").toLowerCase();
const byName=(a,b)=>sortKey(a).localeCompare(sortKey(b),undefined,{sensitivity:"base"})||a.id-b.id;
const dispName=p=>(isLate(p)?"Late ":"")+(p.name||"Unnamed");
const nm=id=>{const p=P(id);return p?dispName(p):""};
function card(p,o){
 const per=period(p),num=bo(p)!==null&&!(o&&o.nn);
 return`<a class="pc${num?" hb":""}" href="#/person/${p.id}">`+

/* ---- Thivasam: date of a Tamil month + paksha + thithi (approximate astronomical calculation for IST) ---- */
const _rad=Math.PI/180,_m360=x=>((x%360)+360)%360;
function sunMoon(ms){
 const T=(ms/864e5+2440587.5-2451545)/36525,sn=x=>Math.sin(x*_rad);
 const L0=280.46646+36000.76983*T,M=357.52911+35999.05029*T;
 const sun=_m360(L0+(1.914602-0.004817*T)*sn(M)+0.019993*sn(2*M)+0.000289*sn(3*M)-0.00569-0.00478*sn(125.04-1934.136*T));
 const Lm=218.3164477+481267.88123421*T,D=297.8501921+445267.1114034*T,Mm=134.9633964+477198.8675055*T,F=93.272095+483202.0175233*T;
 const moon=_m360(Lm+6.288774*sn(Mm)+1.274027*sn(2*D-Mm)+0.658314*sn(2*D)+0.213618*sn(2*Mm)-0.185116*sn(M)-0.114332*sn(2*F)+0.058793*sn(2*D-2*Mm)+0.057066*sn(2*D-M-Mm)+0.053322*sn(2*D+Mm)+0.045758*sn(2*D-M)-0.040923*sn(M-Mm)-0.03472*sn(D)-0.030383*sn(M+Mm)+0.015327*sn(2*D-2*F)-0.012528*sn(Mm+2*F)+0.01098*sn(Mm-2*F));
 return{sun,moon,T}}
const tithiAt=ms=>{const o=sunMoon(ms);return Math.floor(_m360(o.moon-o.sun)/12)+1};
const tmonthAt=ms=>{const o=sunMoon(ms);return Math.floor(_m360(o.sun-(23.853+o.T*100*0.013972))/30)};
const _oc={};
function thivasamOcc(y,tm,tn){
 const k=y+"|"+tm+"|"+tn;if(_oc[k])return _oc[k];
 const out=[];let run=[];
 const flush=()=>{if(!run.length)return;
  let pick=run.find(b=>tithiAt(b+8.5*36e5)===tn);
  if(pick===undefined)pick=run.find(b=>tithiAt(b+0.5*36e5)===tn||tithiAt(b+12.5*36e5)===tn);
  if(pick!==undefined){const d=new Date(pick);out.push(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  run=[]};
 for(let i=0;i<366;i++){const b=Date.UTC(y,0,1)+i*864e5;if(new Date(b).getUTCFullYear()!==y)break;
  if(tmonthAt(b+12.5*36e5)===tm)run.push(b);else flush()}
 flush();return _oc[k]=out}
function thivasamNext(p,t){
 const tm=TMONTH.indexOf(p.death_tamil_month),ti=THITHI.indexOf(p.death_thithi),pk=(p.death_paksha||"").split(" ")[0];
 if(tm<0||ti<0)return null;
 let tn;
 if(p.death_thithi==="Amavasai")tn=30;else if(p.death_thithi==="Pournami")tn=15;
 else if(pk==="Shukla")tn=ti+1;else if(pk==="Krishna")tn=ti+16;else return null;
 const all=[...thivasamOcc(t.getFullYear(),tm,tn),...thivasamOcc(t.getFullYear()+1,tm,tn)].filter(d=>d>=t).sort((a,b)=>a-b);
 return all[0]||null}
/* ---------- Events: birthdays, wedding anniversaries, memorials ---------- */
const MNAME=["January","February","March","April","May","June","July","August","September","October","November","December"];
function mdOf(s){let m;if(!s)return null;
 if(m=String(s).match(/^--(\d{2})-(\d{2})$/))return{m:+m[1],d:+m[2],y:null};
 if(m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/))return{m:+m[2],d:+m[3],y:+m[1]};
 return null}
function allEvents(){

 people.forEach(p=>{
  const b=mdOf(p.dob);if(b)ev.push({k:"b",...b,t:[p.tree],p:[p.id],late:isLate(p)});
  const d=mdOf(p.dod);if(d)ev.push({k:"d",...d,t:[p.tree],p:[p.id]});
  const v=thivasamNext(p,todayD());
  if(v)ev.push({k:"v",m:v.getMonth()+1,d:v.getDate(),y:null,dt:v,t:[p.tree],p:[p.id],tm:p.death_tamil_month,pk:(p.death_paksha||"").split(" ")[0],ti:p.death_thithi})});

/* same idea as the top-down tree: a man is drawn once (under his parents); a woman who has her own parents is drawn
   twice - a dashed stub under her parents (no branch below it) and her main box beside her husband (with the children) */
function treeHtml(T,pool){
 const isF=p=>p.gender==="female"||(!p.gender&&(people.some(c=>c.mother_id===p.id)||spouseIds(p.id).some(i=>P(i)&&P(i).gender==="male")));
 const mainCard=p=>cardNN(p).replace('<a class="pc','<a data-vid="'+p.id+'" class="pc');
 const stubCard=p=>`<a class="pc vref" data-sid="${p.id}" href="javascript:void(0)" onclick="oJump(${p.id})" title="Shown in another place - tap to jump">${esc(dispName(p))} <b>⇄</b></a>`;
 const inlaw=p=>!hasPar(p)&&spouseIds(p.id).some(s=>P(s)&&P(s).tree===T&&hasPar(P(s)));
 const isolated=p=>!hasPar(p)&&!spouseIds(p.id).length&&!childrenOf(p.id).length;
 const roots=pool.filter(p=>!hasPar(p)&&!inlaw(p)&&!isolated(p)).sort((a,b)=>a.id-b.id);
 function run(hold){
  const placed=new Set();
  function unit(p,depth,path){
   placed.add(p.id);
   const all=spouseIds(p.id).map(P).filter(s=>s&&!path.includes(s.id));
   const fresh=all.filter(s=>!placed.has(s.id));
   fresh.forEach(s=>placed.add(s.id));
   const ids=[p.id,...fresh.map(s=>s.id)];
   const key=c=>Math.max(ids.indexOf(c.father_id),ids.indexOf(c.mother_id));
   const np=path.concat(ids);
   const kids=people.filter(c=>(ids.includes(c.father_id)||ids.includes(c.mother_id))&&!np.includes(c.id)).sort((x,y)=>key(x)-key(y)||cmp(x,y));
   const couple=`<div class="couple"><span class="tg">${kids.length?"▸":""}</span>${mainCard(p)}${all.map(s=>`<span class="heart">♥</span>${fresh.includes(s)?mainCard(s):stubCard(s)}`).join("")}</div>`;
   if(!kids.length)return`<div>${couple}</div>`;
   const kh=kids.map(k=>{
    if(placed.has(k.id)||hold.has(k.id))return`<div><div class="couple"><span class="tg"></span>${stubCard(k)}</div></div>`;
    return unit(k,depth+1,np)}).join("");
   return`<details class="tw" ${depth<2?"open":""}><summary>${couple}</summary><div class="kids">${kh}</div></details>`}
  let html="";
  roots.forEach(r=>{if(!placed.has(r.id))html+=`<div class="sec">${unit(r,0,[])}</div>`});
  return{placed,html}}
 let out=run(new Set());
 const hold=new Set();
 const underParents=h=>hasPar(h)&&(out.placed.has(h.father_id)||out.placed.has(h.mother_id));
 people.forEach(k=>{if(hasPar(k)&&isF(k)&&spouseIds(k.id).map(P).some(h=>h&&!isF(h)&&underParents(h)))hold.add(k.id)});
 if(hold.size){
  for(let it=0;it<4;it++){
   out=run(hold);
   const bad=[...hold].filter(id=>!out.placed.has(id));
   if(!bad.length)break;
   bad.forEach(id=>hold.delete(id));
   if(!hold.size){out=run(hold);break}}}
 const html=out.html,others=pool.filter(isolated);
 return`<div class="mut">Tap a name for the full record · tap ▸ to expand · orange boxes = same person shown twice: the main box (men under their parents, women beside their husband) and a dashed ⇄ stub · tap the stub to jump to the main · tap the main to choose person page or stub</div>
 <div class="tools"><button class="alt" onclick="document.querySelectorAll('.tw').forEach(d=>d.open=true)">Expand all</button>
 <button class="alt" onclick="document.querySelectorAll('.tw').forEach(d=>d.open=false)">Collapse all</button></div>
 ${html||'<div class="status">No people yet.</div>'}
 ${others.length?`<details class="sec"><summary><b>Not yet linked (${others.length})</b></summary><div class="grid" style="margin-top:8px">${others.map(cardNN).join("")}</div></details>`:""}`}

/* connector lines for the horizontal layout.
   RULES
   1. Spouses shown together (heart between them): the children's line starts at that heart.
   2. Spouses shown in different places: a thick dotted line in its own colour joins them. It is routed around every box
      (never behind one) and never runs along another line (it may only cross). The children's line branches off that dotted
      line right beside the parent who is shown first.
   3. Every vertical line gets its own lane, so two lines never run on top of each other (they may only cross). */
const HCOL=["#d98aa6","#6fa3d6","#7fbf8a","#d4a95f","#a28bd4"];
const LCOL=["#e6194b","#0077b6","#2e9e47","#7b2cbf","#e08a00","#00a6a6","#6d4c41"];

/* grid router: orthogonal path from S to E that avoids boxes and prefers not to share a lane with an existing line */
function hRoute(S,E,obst,segs,W,H,zones){
 const g=6;                                   /* every line sits on the same 6px lattice, so two lines can never be 3px apart */
 for(const m of [[170,120],[600,400]]){
  const xmin=Math.max(0,Math.min(S[0],E[0])-m[0]),xmax=Math.min(W+80,Math.max(S[0],E[0])+m[0]);
  const ymin=Math.max(0,Math.min(S[1],E[1])-m[1]),ymax=Math.min(H+40,Math.max(S[1],E[1])+m[1]);
  const ox=g*Math.floor(xmin/g),oy=g*Math.floor(ymin/g);
  const cw=Math.ceil((xmax-ox)/g)+1,ch=Math.ceil((ymax-oy)/g)+1,N=cw*ch;
  if(N>1500000)continue;
  const blk=new Uint8Array(N),hO=new Uint8Array(N),vO=new Uint8Array(N);
  const cx=x=>Math.round((x-ox)/g),cy=y=>Math.round((y-oy)/g);
  for(const o of obst){
   if(o.r+4<ox||o.l-4>xmax||o.b+4<oy||o.t-4>ymax)continue;
   const a=Math.max(0,cx(o.l-4)),b=Math.min(cw-1,cx(o.r+4)),c=Math.max(0,cy(o.t-4)),d=Math.min(ch-1,cy(o.b+4));
   for(let y=c;y<=d;y++)for(let x=a;x<=b;x++)blk[y*cw+x]=1}
  /* occupancy: 1 = a line is on this cell, 2 = one cell away, 3 = two cells away (for lines running the same way) */
  const mark=(arr,i,v)=>{if(!arr[i]||arr[i]>v)arr[i]=v};
  for(const sg of segs){
   const x1=sg[0],y1=sg[1],x2=sg[2],y2=sg[3];
   if(y1===y2){const a=Math.max(0,cx(Math.min(x1,x2))),b=Math.min(cw-1,cx(Math.max(x1,x2))),y=cy(y1);
    for(let x=a;x<=b;x++)for(let dy=-2;dy<=2;dy++){const yy=y+dy;if(yy>=0&&yy<ch)mark(hO,yy*cw+x,Math.abs(dy)+1)}}
   else if(x1===x2){const a=Math.max(0,cy(Math.min(y1,y2))),b=Math.min(ch-1,cy(Math.max(y1,y2))),x=cx(x1);
    for(let y=a;y<=b;y++)for(let dx=-2;dx<=2;dx++){const xx=x+dx;if(xx>=0&&xx<cw)mark(vO,y*cw+xx,Math.abs(dx)+1)}}}

   if(z[1]<ox||z[0]>xmax||z[3]<oy||z[2]>ymax)continue;
   const a=Math.max(0,cx(z[0])),b=Math.min(cw-1,cx(z[1])),c=Math.max(0,cy(z[2])),d=Math.min(ch-1,cy(z[3]));

  for(const[px,py]of[[sx,sy],[ex,ey]])for(let y=py-1;y<=py+1;y++)for(let x=px-1;x<=px+1;x++)if(x>=0&&y>=0&&x<cw&&y<ch)blk[y*cw+x]=0;

  const pts=[];for(let s=goal;s>=0;s=prev[s]){const c=s>>2,x=c%cw;pts.push([ox+x*g,oy+((c-x)/cw)*g])}

  out.push(pts[pts.length-1]);
  return out}

 const inlaw=p=>!hasPar(p)&&spouseIds(p.id).some(s=>P(s)&&P(s).tree===T&&hasPar(P(s)));
 const hasKids=p=>childrenOf(p.id).length>0||spouseIds(p.id).some(s=>childrenOf(s).length>0);
 const roots0=pool.filter(p=>!hasPar(p)&&!inlaw(p)&&hasKids(p)).sort((a,b)=>a.id-b.id);
 const sv=st[T],whole=sv===undefined||sv==="all"||!P(sv);
 const roots=whole?roots0:[P(sv)];
 const isF=p=>p.gender==="female"||(!p.gender&&(people.some(c=>c.mother_id===p.id)||spouseIds(p.id).some(i=>P(i)&&P(i).gender==="male")));
 const vc=(p,kid)=>`<span class="vc" data-vid="${p.id}">${card(p,kid&&siblingsOf(p).length?undefined:{nn:1})}</span>`;
 const vr=(p,kid)=>{const num=kid&&bo(p)!==null&&siblingsOf(p).length>0;return`<span class="vc vstub" data-sid="${p.id}"><a class="pc vref${num?" hb":""}" href="javascript:void(0)" onclick="vJump(${p.id})" title="Shown in another place - tap to jump">${num?`<span class="bn" title="Birth order">${esc(p.birth_order)}</span>`:""}${esc(dispName(p))} <b>⇄</b></a></span>`};
 /* one drawing pass. hold = women who must only be a stub under their own parents (their main box sits beside the husband) */
 function run(hold){
  const placed=new Set(),asChild=new Set();
  function unit(p,path,isKid,d){
   placed.add(p.id);
   const all=spouseIds(p.id).map(P).filter(s=>s&&!path.includes(s.id));
   const fresh=all.filter(s=>!placed.has(s.id));
   fresh.forEach(s=>placed.add(s.id));
   const ids=[p.id,...fresh.map(s=>s.id)];
   const np=path.concat(ids);
   const kids=people.filter(c=>(ids.includes(c.father_id)||ids.includes(c.mother_id))&&!np.includes(c.id)).sort(cmp);
   /* children are grouped by their other parent, so with several wives each wife's children get their own line */
   const gs=new Map();
   const cut=d>=depthN&&kids.length>0;   /* level filter: stop here and just show how many children are hidden */
   (cut?[]:kids).forEach(c=>{
    const sp=all.find(s=>s.id===c.father_id||s.id===c.mother_id);
    const k=sp?String(sp.id):(all.length===1?String(all[0].id):"s");
    if(!gs.has(k))gs.set(k,[]);gs.get(k).push(c)});
   const ord=k=>k==="s"?-1:all.findIndex(s=>String(s.id)===k);
   const head=`<div class="vu">${vc(p,isKid)}${all.map(s=>`<span class="vw" data-h="${s.id}">♥</span>${fresh.includes(s)?vc(s):vr(s)}`).join("")}</div>`;
   const groups=[...gs.entries()].sort((x,y)=>ord(x[0])-ord(y[0])).map(([k,g])=>
    `<div class="vg" data-from="${k}"><ul>${g.map(c=>{if(placed.has(c.id)||hold.has(c.id))return`<li>${vr(c,true)}</li>`;asChild.add(c.id);return unit(c,np,true,d+1)}).join("")}</ul></div>`);
   return`<li>${head}${groups.length?`<div class="vks">${groups.join("")}</div>`:""}${cut?`<div class="hmore">+${kids.length} ${kids.length>1?"children":"child"}</div>`:""}</li>`}
  let body="";
  roots.forEach(r=>{if(!placed.has(r.id))body+=`<ul>${unit(r,[],false,1)}</ul>`});
  return{placed,asChild,body}}
 /* pass 1 finds who is reachable as somebody's child; then every woman whose husband is a child of his own parents
    gets her stub under her parents, and the couple (with her main box) is drawn under the husband's parents */
 let out=run(new Set());
 const hold=new Set();
 /* the husband is "under his parents" when either of his parents is drawn in this pass (his box is then listed in their children) */
 const underParents=h=>hasPar(h)&&(out.placed.has(h.father_id)||out.placed.has(h.mother_id));
 people.forEach(k=>{if(hasPar(k)&&isF(k)&&spouseIds(k.id).map(P).some(h=>h&&!isF(h)&&underParents(h)))hold.add(k.id)});
 if(hold.size){
  for(let it=0;it<4;it++){
   out=run(hold);
   const bad=[...hold].filter(id=>!out.placed.has(id));
   if(!bad.length)break;
   bad.forEach(id=>hold.delete(id));
   if(!hold.size){out=run(hold);break}}}
 const cand=treeNames(T,pool).sort(byName);if(!whole&&!cand.includes(P(sv)))cand.unshift(P(sv));
 const body=out.body,left=depthN>=99&&whole?pool.filter(p=>!out.placed.has(p.id)):[];
 return`<div class="tools"><select style="flex:1;min-width:0" onchange="hstart(this.value==='all'?'all':+this.value)"><option value="all" ${whole?"selected":""}>Whole tree (everyone)</option>${cand.map(p=>`<option value="${p.id}" ${!whole&&p.id===sv?"selected":""}>${esc(dispName(p))} (#${p.id})</option>`).join("")}</select><select style="width:auto" onchange="hdepth(this.value)">${["2","3","4","5","all"].map(v=>`<option value="${v}" ${depthV===v?"selected":""}>${v==="all"?"All levels":v+" levels"}</option>`).join("")}</select></div>
 <div class="mut">Scroll sideways and down · tap a name for the full record · orange boxes = same person shown twice: the main box (men under their parents, women beside their husband) and a dashed ⇄ stub · tap the stub to jump to the main · tap the main to choose person page or stub</div>
 <div class="vtw vt${lr?" lr":""}"><div class="vtr">${body||'<div class="status">No families linked yet.</div>'}</div></div>
 ${left.length?`<details class="sec"><summary><b>Not yet linked (${left.length})</b></summary><div class="grid" style="margin-top:8px">${left.map(cardNN).join("")}</div></details>`:""}`}

 if(p.life_status&&p.life_status!=="unknown")v=p.life_status[0].toUpperCase()+p.life_status.slice(1);

 return lr+filled.join("")+(blank.length?`<b style="grid-column:1/-1;margin-top:10px">Not filled yet</b>`+blank.join(""):"")}
function rec(p,full){
 const per=period(p),id=p.id;
 const ln=(l,h)=>h?`<div class="ml"><b>${l}:</b> ${h}</div>`:"";
 const sps=marriages.filter(m=>m.person1_id===id||m.person2_id===id).map(m=>({m,o:P(m.person1_id===id?m.person2_id:m.person1_id)})).filter(x=>x.o);
 const spH=sps.map(({m,o})=>{
  let extra="";
  if(full){const bits=[m.status&&m.status!=="married"?m.status:"",m.engagement_date?"engaged "+fmtDate(m.engagement_date)+(m.engagement_place?" at "+esc(m.engagement_place):""):"",m.marriage_date?"wedding "+fmtDate(m.marriage_date)+(m.wedding_place?" at "+esc(m.wedding_place):""):"",m.end_date?"ended "+fmtDate(m.end_date):""].filter(Boolean).join(", ");
   if(bits)extra=` <span class="mut">(${bits})</span>`;
   if(canEdit())extra+=` <a class="lk" href="javascript:openMarriage(${m.id})">✎</a> <a class="lk" style="color:var(--red)" href="javascript:delMarriage(${m.id})">🗑</a>`}
  return lk(o)+extra}).join(", ");
 const kids=childrenOf(id),sibs=siblingsOf(p);
 const oth=c=>c.father_id===id?c.mother_id:c.father_id,seen=new Set(),groups=[];
 sps.forEach(({o})=>{if(seen.has(o.id))return;seen.add(o.id);const g=kids.filter(c=>oth(c)===o.id);if(g.length)groups.push([o,g])});
 const used=new Set(groups.flatMap(([,g])=>g.map(c=>c.id))),rest=kids.filter(c=>!used.has(c.id));
 const okids=groups.flatMap(([,g])=>g).concat(rest);
 const kidsH=groups.length>1||(groups.length&&rest.length)?`<div class="ml"><b>Children:</b></div>`+groups.map(([o,g])=>`<div class="ml" style="margin-left:14px"><b>with ${esc(o.name)}:</b> ${lks(g)}</div>`).join("")+(rest.length?`<div class="ml" style="margin-left:14px"><b>other:</b> ${lks(rest)}</div>`:""):ln("Children",lks(kids));
 const gk=full?okids.flatMap(c=>childrenOf(c.id)):[];
 const sub=[p.profession,p.current_location].filter(Boolean).join(" · ");
 return`<div class="mc ${full?"full":""}"><div class="mh"><div>
  ${full?`<div class="nm" style="font-size:1.25rem">${esc(dispName(p))}</div>`:`<a class="nm" href="#/person/${id}">${esc(dispName(p))}</a>`}
  <span class="sub">#${id} · ${TL[p.tree]||""}${gOn()?" · "+(p.gender==="male"?"♂ Male":p.gender==="female"?"♀ Female":"⚠ Gender not set"):""}${kOn()&&p.kothram?" · 🕉 "+esc(p.kothram):""}</span>
  ${per?`<div class="mut">${esc(per)}</div>`:""}${sub?`<div class="mut">${esc(sub)}</div>`:""}</div>
  ${p.photo_url?`<img class="ph" loading="lazy" src="${esc(p.photo_url)}" alt="">`:`<div class="ph">👤</div>`}</div>
  ${ln("Father",P(p.father_id)?lk(P(p.father_id)):"")}${ln("Mother",P(p.mother_id)?lk(P(p.mother_id)):"")}
  ${ln("Spouse",spH)}${kidsH}${ln("Siblings",lks(sibs))}${ln("Grandchildren",lk0(gk))}
  ${full?`<div class="kv" style="margin-top:8px">${moreRows(p)}</div>${role?"":`<p class="mut">Sign in to see more details.</p>`}`:""}${full?"":`<a class="more" href="#/person/${id}" title="Full record">⋯</a> <a class="more" style="font-size:.85rem;font-weight:600;padding:4px 10px" href="javascript:toTreeLR(${id})" title="Show in left-to-right tree">🌳 Left-right tree</a>`}</div>`}

 if(t==="text")inp=`<input id="${id}" value="${esc(v)}">`;

/* ---------- bulk inherit (kothram / native place) ----------
   Kothram: a man's kothram passes to his wife and all descendants; a woman takes her husband's kothram once married.
   Native place: a man's native passes to his children, to his sons' children, and so on down the male line (a wife keeps her own).
   Only the root ancestors (no father on record, and for kothram no husband) need a value typed in; everything else is derived. */
const KOTH={field:"kothram",wife:true,title:"Kothram",ph:"kothram",
 rule:"A man's kothram goes to his wife and all descendants. A daughter (or granddaughter, etc.) takes her husband's kothram when she marries."};
const NATIVE={field:"native_place",wife:false,title:"Native place",ph:"native place",
 rule:"A man's native place goes to his children, to his sons' children, and so on down the male line. A daughter keeps her father's native after marriage; her own children follow their father's. A wife keeps her own native place."};
function inheritCalc(seeds,F){
 const memo=new Map(),busy=new Set();
 const ms=[...marriages].sort((a,b)=>a.id-b.id);
 const husb=p=>{if(!F.wife||p.gender!=="female")return null;
  const hs=ms.filter(m=>(m.person1_id===p.id||m.person2_id===p.id)&&["married","widowed","separated"].includes(m.status))
   .map(m=>P(m.person1_id===p.id?m.person2_id:m.person1_id)).filter(o=>o&&o.gender==="male");
  return hs.length?hs[hs.length-1]:null};
 const kt=p=>{
  if(memo.has(p.id))return memo.get(p.id);
  if(busy.has(p.id))return{v:null,r:p.id};
  busy.add(p.id);
  const h=husb(p),f=P(p.father_id);let o;
  if(h)o=kt(h);else if(f)o=kt(f);
  else o={v:((seeds[p.id]??p[F.field]??"")+"").trim()||null,r:p.id};
  busy.delete(p.id);memo.set(p.id,o);return o};
 people.forEach(kt);
 const cnt={};people.forEach(p=>{const r=memo.get(p.id).r;cnt[r]=(cnt[r]||0)+1});
 return{memo,cnt}}
const kothramCalc=seeds=>inheritCalc(seeds,KOTH);
function openKothram(){openInherit(KOTH)}
function openNative(){openInherit(NATIVE)}
function openInherit(F){
 const d=$("#dlg"),seeds={},off=new Set(),fld=F.field;
 const base=inheritCalc({},F);
 const roots=people.filter(p=>base.cnt[p.id]>1&&base.memo.get(p.id).r===p.id)
  .sort((a,b)=>base.cnt[b.id]-base.cnt[a.id]||(a.name||"").localeCompare(b.name||""));
 /* prefill each root: its own value, else a value already recorded in its line (for kothram only men count, since women change on marriage); flag if those disagree */
 const hint={};
 roots.forEach(r=>{
  const vs={};people.forEach(p=>{const v=(p[fld]||"").trim();if((!F.wife||p.gender==="male")&&v&&base.memo.get(p.id).r===r.id){(vs[v]=vs[v]||[]).push(p.id)}});
  const ks=Object.keys(vs);
  if(r[fld])seeds[r.id]=r[fld];
  else if(ks.length)seeds[r.id]=ks.sort((a,b)=>vs[b].length-vs[a].length)[0];
  if(!r[fld]&&ks.length)hint[r.id]="from #"+vs[seeds[r.id]][0];
  if(ks.length>1)hint[r.id]=(hint[r.id]||"")+" ⚠ different values in this line: "+ks.join(" / ")});
 const noGender=F.wife?people.filter(p=>p.gender!=="male"&&p.gender!=="female"):[];
 d.innerHTML=`<h2>Bulk update ${F.title}</h2><div id="msg" class="mut" style="color:var(--red)"></div>
 <p class="mut">${F.rule} Enter the ${F.ph} of each root ancestor below - it flows down automatically.</p>
 ${noGender.length?`<p class="mut" style="color:var(--red)">No gender set: ${noGender.map(p=>esc(p.name)+" (#"+p.id+")").join(", ")} - treated as male line (their marriage does not change ${F.ph}).</p>`:""}
 <b>Root ancestors (${roots.length})</b>
 <div style="max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;margin:6px 0">
 ${roots.map(p=>`<div class="rr"><div class="rn">${esc(p.name)} <span>#${p.id} · ${base.cnt[p.id]} people${hint[p.id]?` · ${esc(hint[p.id])}`:""}</span></div><input class="ks" data-r="${p.id}" value="${esc(seeds[p.id]||"")}" placeholder="${F.ph}"></div>`).join("")}</div>
 <b id="ptitle"></b>
 <div id="prev" style="max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;margin:6px 0"></div>
 <div class="row" style="justify-content:flex-end"><button class="alt" id="cx">Cancel</button><button id="sv">Apply</button></div>`;
 let chg=[];
 const draw=()=>{
  const r=inheritCalc(seeds,F);
  chg=people.filter(p=>{const v=r.memo.get(p.id).v;return v&&v!==(p[fld]||"")}).map(p=>({p,v:r.memo.get(p.id).v}));
  const on=chg.filter(c=>!off.has(c.p.id));
  $("#ptitle").textContent=`Preview: ${chg.length} change${chg.length===1?"":"s"} (${on.length} selected)`;
  $("#prev").innerHTML=chg.length?chg.map(({p,v})=>`<label class="kr"><input type="checkbox" class="kc" data-id="${p.id}" ${off.has(p.id)?"":"checked"}><span class="kn">${esc(p.name)} <span class="mut">#${p.id}</span></span><span class="kc2">${esc(p[fld]||"—")} → <b style="color:var(--ink)">${esc(v)}</b></span></label>`).join(""):`<span class="mut">Nothing to change yet. Enter a ${F.ph} for the root ancestors above.</span>`;
  $("#sv").disabled=!on.length;$("#sv").textContent=`Apply ${on.length}`};
 d.querySelectorAll(".ks").forEach(i=>i.oninput=()=>{seeds[+i.dataset.r]=i.value;draw()});
 $("#prev").onchange=e=>{const c=e.target;if(c.classList&&c.classList.contains("kc")){const id=+c.dataset.id;c.checked?off.delete(id):off.add(id);draw()}};
 $("#cx").onclick=()=>d.close();
 $("#sv").onclick=async()=>{
  const by={};chg.filter(c=>!off.has(c.p.id)).forEach(c=>(by[c.v]=by[c.v]||[]).push(c.p.id));
  $("#sv").disabled=true;
  for(const [v,ids] of Object.entries(by)){
   const {error}=await sb.from("ft_people").update({[fld]:v}).in("id",ids);
   if(error){$("#msg").textContent=error.message;$("#sv").disabled=false;return}}
  d.close();await load()};
 draw();d.showModal()}

function collect(F,errs){const o={};
 F.forEach(([k,l,t])=>{const e=document.getElementById("f_"+k);let v;
  if(t==="chk")v=e.checked;else{v=e.value.trim();if(v==="")v=null;
   else if(t==="person"||t==="num")v=Number(v);
   else if(t==="date"&&!/^(\d{4}(-\d{2}(-\d{2})?)?|--\d{2}-\d{2})$/.test(v))errs.push(l+": use YYYY-MM-DD, YYYY-MM, YYYY or --MM-DD")}
  o[k]=v});return o}
function openForm(title,F,rec,onSave){
 const d=$("#dlg");
 d.innerHTML=`<h2>${title}</h2><div id="msg" class="mut" style="color:var(--red)"></div><div class="two">${F.map(f=>{const w=["area","photo"].includes(f[2]);return`<div data-k="${f[0]}" style="${w?"grid-column:1/-1":""}">${fieldHtml(f,rec[f[0]]??"")}</div>`}).join("")}</div>
 <div class="row" style="justify-content:flex-end"><button class="alt" id="cx">Cancel</button><button id="sv">Save</button></div>`;
 $("#cx").onclick=()=>d.close();
 $("#sv").onclick=async()=>{const errs=[];const o=collect(F,errs);
  if(errs.length)return $("#msg").textContent=errs.join(" · ");
  $("#sv").disabled=true;const err=await onSave(o);
  if(err){$("#msg").textContent=err;$("#sv").disabled=false}else d.close()};
 const tg=()=>{const s=document.getElementById("f_life_status"),od=document.getElementById("f_dod");if(!s)return;
  const dead=s.value==="deceased"||(od&&od.value.trim()!=="");
  d.querySelectorAll('[data-k="dod"],[data-k="death_place"],[data-k="death_tamil_month"],[data-k="death_paksha"],[data-k="death_thithi"]').forEach(x=>x.style.display=dead?"":"none")};
 tg();const ls=document.getElementById("f_life_status");if(ls)ls.onchange=tg;
 d.showModal()}
async function upPhoto(inp,id){const f=inp.files[0];if(!f)return;
 try{const bmp=await createImageBitmap(f);const s=Math.min(1,600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=bmp.width*s;c.height=bmp.height*s;c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  const path=`p${Date.now()}.jpg`;
  const {error}=await sb.storage.from("ft-photos").upload(path,blob,{contentType:"image/jpeg"});
  if(error)throw error;
  const url=sb.storage.from("ft-photos").getPublicUrl(path).data.publicUrl;
  document.getElementById(id).value=url;const pv=document.getElementById(id+"_pv");pv.src=url;pv.hidden=false;
 }catch(e){$("#msg").textContent="Photo upload failed: "+e.message}}

function openPerson(id,preset){
 const rec=id?P(id):(preset||{life_status:"unknown",tree:curTree});
 openForm(id?"Edit person":"Add member",PF,rec,async o=>{
  if(o.name)o.name=o.name.replace(/^\s*late\s+/i,"");
  if(!o.name)return"Name is required";
  const r=id?await sb.from("ft_people").update(o).eq("id",id).select().single():await sb.from("ft_people").insert(o).select().single();
  if(r.error)return r.error.message;
  await load();location.hash="#/person/"+r.data.id})}
function addChild(pid){const p=P(pid);
 openPerson(null,{life_status:"unknown",tree:p.tree,[p.gender==="female"?"mother_id":"father_id"]:pid,branch:p.branch})}
async function delPerson(id){
 if(!confirm(`Delete ${nm(id)}? Their marriages are removed; children keep their record but lose this parent link.`))return;
 const {error}=await sb.from("ft_people").delete().eq("id",id);
 if(error)return alert(error.message);await load();location.hash="#/members"}
function openMarriage(id,pid){
 const rec=id?marriages.find(m=>m.id===id):{person1_id:pid||null,status:"married"};
 openForm(id?"Edit couple":"Add couple",MF,rec,async o=>{
  if(!o.person1_id||!o.person2_id)return"Select both people";
  if(o.person1_id===o.person2_id)return"Choose two different people";
  const r=id?await sb.from("ft_marriages").update(o).eq("id",id):await sb.from("ft_marriages").insert(o);
  if(r.error)return r.error.message;await load()})}
async function delMarriage(id){if(!confirm("Delete this marriage record?"))return;
 const {error}=await sb.from("ft_marriages").delete().eq("id",id);if(error)return alert(error.message);await load()}

/* ---------- login: user ID + password ---------- */
const LABEL={admin:"Admin",member_advanced:"Member (advanced)",member_basic:"Member (basic)"};
const uid2mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@family-tree.app";
function viewLogin(app){
 if(session){const u=(session.user.email||"").split("@")[0];
  app.innerHTML=`<h2>Account</h2><div class="sec">Signed in as <b>${esc(u)}</b><br>Access: <b>${esc(LABEL[role]||"no access assigned - ask the admin")}</b>
  <div class="row"><button id="lo">Sign out</button></div></div>`;
  $("#lo").onclick=async()=>{await sb.auth.signOut();location.hash="#/"};return}
 app.innerHTML=`<h2>Sign in</h2><div class="sec"><div id="lm" class="mut" style="color:var(--red)"></div>
  <label>User ID</label><input id="ui" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row"><button id="go">Sign in</button></div>
  <p class="mut">Without signing in you can see names, relationships and life periods only.</p></div>`;
 const go=async()=>{const u=$("#ui").value,p=$("#pw").value;if(!u||!p)return;
  $("#go").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:uid2mail(u),password:p});
  $("#go").disabled=false;
  if(error)return $("#lm").textContent="Wrong user ID or password";
  location.hash="#/"};
 $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()}}
</script></body></html>

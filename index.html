<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#243047;--mut:#65738a;--line:#dbe3ef;--pri:#234e8a;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Noto Sans Tamil","Latha",sans-serif}
a{color:inherit;text-decoration:none}
header{background:var(--pri);color:#fff;position:sticky;top:0;z-index:10}
.top{max-width:1050px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{font-weight:700;font-size:1.15rem;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:.95rem}
nav a.on{background:#ffffff30}
#who{font-size:1.3rem;padding:4px 8px;cursor:pointer;background:none;border:0;color:#fff}
main{max-width:1050px;margin:auto;padding:14px}
h2{margin:.2em 0 .6em}
.mut{color:var(--mut);font-size:.85rem}
.status{padding:10px;background:#e7eef8;border-radius:8px;margin:10px 0}
.warn{background:#fff3cd}
button,.btn{font:inherit;padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:var(--pri);color:#fff;cursor:pointer;display:inline-block}
button.alt,.btn.alt{background:#e7eef8;color:var(--pri);border-color:#b8c8e2}
button.red{background:var(--red);border-color:var(--red)}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;margin:10px 0 2px;font-size:.85rem;color:var(--mut)}
/* person card */
.pc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.pc:hover{border-color:var(--pri)}
.pc img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.pc .n{font-weight:600;overflow-wrap:anywhere}
.pc .t{font-size:.9rem;color:var(--ink)}
.pc .p{font-size:.8rem;color:var(--mut)}
.pc.ph .n{font-weight:400;color:var(--mut)}
/* tree */
.couple{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.couple .heart{color:#c2185b}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.tw>summary .couple::before{content:"▸";color:var(--mut);margin-right:2px}
.tw[open]>summary .couple::before{content:"▾"}
.kids{margin-left:14px;border-left:2px solid #c5d2e6;padding-left:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
/* person page */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.hero img{width:110px;height:110px;border-radius:14px;object-fit:cover}
.hero h1{margin:0;font-size:1.4rem}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.sec h3{margin:0 0 8px;font-size:1rem;color:var(--mut)}
.more>summary{padding:8px 0;color:var(--pri);font-weight:600}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px}
.kv b{color:var(--mut);font-weight:500}
.kv span{overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sub{font-size:.8rem;color:var(--mut);margin-left:4px}
dialog{border:1px solid #cbd5e1;border-radius:14px;width:min(94vw,520px);max-height:90vh;color:var(--ink);padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:480px){.two{grid-template-columns:1fr}.kv{grid-template-columns:105px 1fr}}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}
.pv{width:80px;height:80px;border-radius:12px;object-fit:cover;margin-top:6px}
</style></head><body>
<header><div class="top">
  <a class="brand" href="#/">🌳 Family Tree</a>
  <nav id="nav"></nav>
  <button id="who" title="Sign in" aria-label="Sign in">👤</button>
</div></header>
<main id="app"><div class="status">Loading…</div></main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://wzxouwyhpqqjyxfppzkw.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_J6TXONzH6rGFhM98qEQfAg_V5PEJW5-";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let people=[],marriages=[],session=null,role=null,loadErr="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canEdit=()=>role==="editor"||role==="admin";
const P=id=>people.find(p=>p.id===id);

/* ---------- field definitions: [key,label,type,extra] ---------- */
const PF=[
["name","Name (English)","text"],["name_ta","Name (தமிழ்)","text"],["nickname","Nickname","text"],
["gender","Gender","sel",["male","female","other"]],
["father_id","Father","person"],["mother_id","Mother","person"],["birth_order","Birth order among siblings","num"],
["dob","Date of birth","date"],["birth_time","Time of birth","time"],["birth_place","Place of birth","text"],
["life_status","Alive / Deceased","sel",["alive","deceased","unknown"]],
["dod","Date of death","date"],["death_place","Place of death","text"],
["education","Education","text"],["profession","Profession","text"],
["current_location","Currently lives in","text"],["native_place","Native place","text"],
["kothram","Kothram","text"],["rasi","Rasi","text"],["natchathiram","Natchathiram","text"],
["phone","Phone","text"],["email","Email","text"],
["blood_group","Blood group","sel",["A+","A-","B+","B-","AB+","AB-","O+","O-"]],
["branch","Family line / branch","text"],
["is_placeholder","Real name not known yet","chk"],
["notes","Notes","area"],["photo_url","Photo","photo"]];
const MF=[
["person1_id","Person 1","person"],["person2_id","Person 2","person"],
["status","Status","sel",["engaged","married","separated","divorced","widowed"]],
["engagement_date","Engagement date","date"],["engagement_place","Engagement place","text"],
["marriage_date","Wedding date","date"],["wedding_place","Wedding place","text"],
["end_date","Separation / divorce date","date"],["notes","Notes","area"],["photo_url","Photo","photo"]];

/* ---------- helpers ---------- */
function fmtDate(s){if(!s)return"";let m;
 if(/^\d{4}$/.test(s))return s;
 if(m=s.match(/^(\d{4})-(\d{2})$/))return`${m[2]}-${m[1]}`;
 if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))return`${m[3]}-${m[2]}-${m[1]}`;
 return s}
const isLate=p=>p.life_status==="deceased"||!!p.dod;
function period(p){const b=fmtDate(p.dob),d=fmtDate(p.dod);
 if(b&&d)return`${b} – ${d}`;
 if(b)return isLate(p)?`${b} – ?`:`b. ${b}`;
 if(d)return`d. ${d}`;return""}
const dispName=p=>(isLate(p)&&!p.is_placeholder?"Late ":"")+(p.name||"Unnamed");
const nm=id=>{const p=P(id);return p?dispName(p):""};
function card(p){
 const per=period(p);
 return`<a class="pc ${p.is_placeholder?"ph":""}" href="#/person/${p.id}">`+
 (p.photo_url?`<img loading="lazy" src="${esc(p.photo_url)}" alt="">`:"")+
 `<div><div class="n">${esc(dispName(p))}</div>`+
 (p.name_ta?`<div class="t">${esc(p.name_ta)}</div>`:"")+
 (per?`<div class="p">${esc(per)}</div>`:"")+`</div></a>`}
const bo=p=>{const n=Number(p.birth_order);return p.birth_order==null||!isFinite(n)?null:n};
function cmp(a,b){const x=bo(a),y=bo(b);if(x===null&&y===null)return a.id-b.id;if(x===null)return 1;if(y===null)return-1;return x-y||a.id-b.id}
const spouseIds=id=>[...new Set(marriages.filter(m=>m.person1_id===id||m.person2_id===id).map(m=>m.person1_id===id?m.person2_id:m.person1_id))];
const childrenOf=id=>people.filter(c=>c.father_id===id||c.mother_id===id).sort(cmp);
const siblingsOf=p=>people.filter(o=>o.id!==p.id&&((p.father_id&&o.father_id===p.father_id)||(p.mother_id&&o.mother_id===p.mother_id))).sort(cmp);
const links=ps=>ps.length?`<div class="grid">${ps.map(card).join("")}</div>`:`<span class="mut">Not recorded</span>`;

/* ---------- data ---------- */
async function load(){
 loadErr="";
 const {data:{session:s}}=await sb.auth.getSession();session=s;role=null;
 if(s){const r=await sb.from("app_users").select("role").eq("user_id",s.user.id).maybeSingle();role=r.data?.role||null}
 const full=!!role;
 const [a,b]=await Promise.all([
  sb.from(full?"people":"family_public_people").select("*").order("id"),
  sb.from(full?"marriages":"family_public_marriages").select("*").order("id")]);
 if(a.error||b.error){loadErr=(a.error||b.error).message;people=[];marriages=[]}
 else{people=a.data;marriages=b.data}
 renderNav();route()}
sb.auth.onAuthStateChange(()=>setTimeout(load,0));

/* ---------- nav / routing ---------- */
function renderNav(){
 const h=location.hash.slice(1)||"/";
 const items=[["/","Family Tree"],["/members","Members"],["/couples","Couples"]];
 if(canEdit())items.push(["/add","+ Add Member"]);
 $("#nav").innerHTML=items.map(([u,t])=>`<a href="#${u}" class="${h===u||(u==="/members"&&h.startsWith("/person"))?"on":""}">${t}</a>`).join("");
 $("#who").textContent=session?"✅":"👤";
 $("#who").title=session?"Account":"Sign in"}
window.addEventListener("hashchange",()=>{renderNav();route();window.scrollTo(0,0)});
$("#who").onclick=()=>{location.hash="#/login"};

function route(){
 const [,a,b]=(location.hash.slice(1)||"/").split("/");
 const app=$("#app");
 if(a==="login")return viewLogin(app);
 if(loadErr){app.innerHTML=`<div class="status warn">Could not load data: ${esc(loadErr)}<br>Did you run schema.sql in Supabase?</div>`;return}
 if(a==="members")return viewMembers(app);
 if(a==="couples")return viewCouples(app);
 if(a==="person")return viewPerson(app,+b);
 if(a==="add"){if(canEdit()){app.innerHTML="";openPerson()}else location.hash="#/login";return}
 viewTree(app)}

/* ---------- Tree (home) ---------- */
function viewTree(app){
 const hasPar=p=>p.father_id||p.mother_id;
 const shown=new Set(),expanded=new Set();
 function unit(p,depth){
  const sps=spouseIds(p.id).map(P).filter(Boolean);
  const ids=[p.id,...sps.map(s=>s.id)];
  ids.forEach(i=>shown.add(i));
  let kids=[];
  if(!expanded.has(p.id)){ids.forEach(i=>expanded.add(i));
   kids=people.filter(c=>ids.includes(c.father_id)||ids.includes(c.mother_id)).sort(cmp)}
  const couple=`<div class="couple">${card(p)}${sps.map(s=>`<span class="heart">♥</span>${card(s)}`).join("")}</div>`;
  if(!kids.length)return`<div>${couple}</div>`;
  return`<details class="tw" ${depth<2?"open":""}><summary>${couple}</summary><div class="kids">${kids.map(k=>unit(k,depth+1)).join("")}</div></details>`}
 const inlaw=p=>!hasPar(p)&&spouseIds(p.id).some(s=>P(s)&&hasPar(P(s)));
 const isolated=p=>!hasPar(p)&&!spouseIds(p.id).length&&!childrenOf(p.id).length;
 const roots=people.filter(p=>!hasPar(p)&&!inlaw(p)&&!isolated(p)).sort((a,b)=>a.id-b.id);
 let html="";
 roots.forEach(r=>{if(!shown.has(r.id))html+=`<div class="sec">${unit(r,0)}</div>`});
 const others=people.filter(isolated);
 app.innerHTML=`<h2>Family Tree</h2><div class="mut">${people.length} people · tap a name for full record · tap ▸ to expand</div>
 <div class="tools"><button class="alt" onclick="document.querySelectorAll('.tw').forEach(d=>d.open=true)">Expand all</button>
 <button class="alt" onclick="document.querySelectorAll('.tw').forEach(d=>d.open=false)">Collapse all</button></div>
 ${html||'<div class="status">No people yet.</div>'}
 ${others.length?`<details class="sec"><summary><b>Not yet linked (${others.length})</b></summary><div class="grid" style="margin-top:8px">${others.map(card).join("")}</div></details>`:""}`}

/* ---------- Members ---------- */
let q="";
function viewMembers(app){
 app.innerHTML=`<h2>Members</h2><input id="q" placeholder="Search name (English / தமிழ்), ID…" value="${esc(q)}"><div id="cnt" class="mut" style="margin:8px 0"></div><div id="list" class="grid"></div>`;
 const draw=()=>{const t=q.trim().toLowerCase();
  const r=people.filter(p=>!t||[p.name,p.name_ta,p.nickname,p.native_place,p.current_location,p.profession,String(p.id)].some(v=>v&&String(v).toLowerCase().includes(t)))
   .sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  $("#cnt").textContent=`${r.length} of ${people.length}`;$("#list").innerHTML=r.map(card).join("")};
 $("#q").oninput=e=>{q=e.target.value;draw()};draw()}

/* ---------- Couples ---------- */
function viewCouples(app){
 const list=[...marriages].sort((a,b)=>a.id-b.id);
 app.innerHTML=`<h2>Couples</h2><div class="mut">${list.length} marriages</div>`+list.map(m=>{
  const a=P(m.person1_id),b=P(m.person2_id);if(!a||!b)return"";
  const bits=[m.status&&m.status!=="married"?m.status:"",m.engagement_date?"Engaged "+fmtDate(m.engagement_date):"",m.marriage_date?"Wedding "+fmtDate(m.marriage_date):"",m.wedding_place].filter(Boolean).join(" · ");
  return`<div class="sec"><div class="couple">${card(a)}<span class="heart">♥</span>${card(b)}</div>${bits?`<div class="mut">${esc(bits)}</div>`:""}
  ${canEdit()?`<div class="row"><button class="alt" onclick="openMarriage(${m.id})">Edit</button><button class="red" onclick="delMarriage(${m.id})">Delete</button></div>`:""}</div>`}).join("")+
  (canEdit()?`<div class="row"><button onclick="openMarriage()">+ Add couple</button></div>`:"")}

/* ---------- Person page ---------- */
function viewPerson(app,id){
 const p=P(id);
 if(!p){app.innerHTML=`<div class="status warn">Person not found. <a href="#/members" style="text-decoration:underline">Back to members</a></div>`;return}
 const per=period(p);
 const ms=marriages.filter(m=>m.person1_id===id||m.person2_id===id);
 const spHtml=ms.length?ms.map(m=>{const o=P(m.person1_id===id?m.person2_id:m.person1_id);if(!o)return"";
  const bits=[m.status&&m.status!=="married"?m.status:"",m.engagement_date?"Engaged "+fmtDate(m.engagement_date)+(m.engagement_place?" at "+m.engagement_place:""):"",m.marriage_date?"Wedding "+fmtDate(m.marriage_date)+(m.wedding_place?" at "+m.wedding_place:""):"",m.end_date?"Ended "+fmtDate(m.end_date):""].filter(Boolean).join(" · ");
  return`${card(o)}${bits?`<div class="mut" style="margin:2px 0 6px 6px">${esc(bits)}</div>`:""}`}).join(""):`<span class="mut">Not recorded</span>`;
 const par=[p.father_id,p.mother_id].map(P).filter(Boolean);
 const rows=PF.filter(([k])=>!["photo_url"].includes(k)&&p[k]!=null&&p[k]!==""&&!(k==="is_placeholder"&&!p[k])).map(([k,l,t])=>{
  let v=p[k];
  if(t==="person")v=`<a href="#/person/${v}" style="text-decoration:underline">${esc(nm(v))}</a>`;
  else if(t==="date")v=esc(fmtDate(v));
  else if(t==="chk")v="Yes";else v=esc(v);
  return`<b>${l}</b><span>${v}</span>`}).join("");
 app.innerHTML=`<div class="hero">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:""}<div>
  <h1>${esc(dispName(p))}</h1>${p.name_ta?`<div>${esc(p.name_ta)}</div>`:""}${per?`<div class="mut">${esc(per)}</div>`:""}
  ${p.profession||p.current_location?`<div class="mut">${esc([p.profession,p.current_location].filter(Boolean).join(" · "))}</div>`:""}</div></div>
 <div class="sec"><h3>Parents</h3>${links(par)}</div>
 <div class="sec"><h3>Spouse</h3>${spHtml}</div>
 <div class="sec"><h3>Children</h3>${links(childrenOf(id))}</div>
 <div class="sec"><h3>Siblings</h3>${links(siblingsOf(p))}</div>
 <div class="sec"><details class="more"><summary>⋯ More details</summary><div class="kv"><b>ID</b><span>${p.id}</span>${rows}
  ${p.created_at?`<b>Last updated</b><span>${esc(String(p.updated_at).slice(0,10))}</span>`:""}</div>
  ${role?"":`<p class="mut">Sign in to see private details (birth time, contact, location, kothram…).</p>`}</details></div>
 ${canEdit()?`<div class="row"><button onclick="openPerson(${id})">Edit</button>
  <button class="alt" onclick="addChild(${id})">+ Child</button>
  <button class="alt" onclick="openMarriage(null,${id})">+ Spouse</button>
  <button class="red" onclick="delPerson(${id})">Delete</button></div>`:""}`}

/* ---------- forms ---------- */
function fieldHtml([k,l,t,x],v){
 const id="f_"+k;let inp="";
 if(t==="text")inp=`<input id="${id}" value="${esc(v)}">`;
 else if(t==="num")inp=`<input id="${id}" type="number" step="0.5" value="${esc(v)}">`;
 else if(t==="time")inp=`<input id="${id}" type="time" value="${esc(v)}">`;
 else if(t==="date")inp=`<input id="${id}" value="${esc(v)}" placeholder="YYYY-MM-DD or YYYY-MM or YYYY">`;
 else if(t==="area")inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else if(t==="chk")return`<label class="ck"><input id="${id}" type="checkbox" ${v?"checked":""}> ${l}</label>`;
 else if(t==="sel")inp=`<select id="${id}"><option value=""></option>${x.map(o=>`<option ${o===v?"selected":""} value="${o}">${o[0].toUpperCase()+o.slice(1)}</option>`).join("")}</select>`;
 else if(t==="person")inp=`<select id="${id}"><option value=""></option>${[...people].sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(p=>`<option value="${p.id}" ${p.id===v?"selected":""}>${esc(p.name)} (#${p.id})</option>`).join("")}</select>`;
 else if(t==="photo")inp=`<input id="${id}" type="hidden" value="${esc(v)}"><input type="file" accept="image/*" onchange="upPhoto(this,'${id}')"><img id="${id}_pv" class="pv" src="${esc(v)}" ${v?"":"hidden"} alt="">`;
 return`<label for="${id}">${l}</label>${inp}`}
function collect(F,errs){const o={};
 F.forEach(([k,l,t])=>{const e=document.getElementById("f_"+k);let v;
  if(t==="chk")v=e.checked;else{v=e.value.trim();if(v==="")v=null;
   else if(t==="person"||t==="num")v=Number(v);
   else if(t==="date"&&!/^\d{4}(-\d{2}(-\d{2})?)?$/.test(v))errs.push(l+": use YYYY-MM-DD, YYYY-MM or YYYY")}
  o[k]=v});return o}
function openForm(title,F,rec,onSave){
 const d=$("#dlg");
 d.innerHTML=`<h2>${title}</h2><div id="msg" class="mut" style="color:var(--red)"></div><div class="two">${F.map(f=>{const w=["area","photo"].includes(f[2]);return`<div style="${w?"grid-column:1/-1":""}">${fieldHtml(f,rec[f[0]]??"")}</div>`}).join("")}</div>
 <div class="row" style="justify-content:flex-end"><button class="alt" id="cx">Cancel</button><button id="sv">Save</button></div>`;
 $("#cx").onclick=()=>d.close();
 $("#sv").onclick=async()=>{const errs=[];const o=collect(F,errs);
  if(errs.length)return $("#msg").textContent=errs.join(" · ");
  $("#sv").disabled=true;const err=await onSave(o);
  if(err){$("#msg").textContent=err;$("#sv").disabled=false}else d.close()};
 d.showModal()}
async function upPhoto(inp,id){const f=inp.files[0];if(!f)return;
 try{const bmp=await createImageBitmap(f);const s=Math.min(1,600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=bmp.width*s;c.height=bmp.height*s;c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
  const path=`p${Date.now()}.jpg`;
  const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
  if(error)throw error;
  const url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
  document.getElementById(id).value=url;const pv=document.getElementById(id+"_pv");pv.src=url;pv.hidden=false;
 }catch(e){$("#msg").textContent="Photo upload failed: "+e.message}}

function openPerson(id,preset){
 const rec=id?P(id):(preset||{life_status:"unknown"});
 openForm(id?"Edit person":"Add member",PF,rec,async o=>{
  if(!o.name)return"Name is required";
  const r=id?await sb.from("people").update(o).eq("id",id).select().single():await sb.from("people").insert(o).select().single();
  if(r.error)return r.error.message;
  await load();location.hash="#/person/"+r.data.id})}
function addChild(pid){const p=P(pid);
 openPerson(null,{life_status:"unknown",[p.gender==="female"?"mother_id":"father_id"]:pid,branch:p.branch})}
async function delPerson(id){
 if(!confirm(`Delete ${nm(id)}? Their marriages are removed; children keep their record but lose this parent link.`))return;
 const {error}=await sb.from("people").delete().eq("id",id);
 if(error)return alert(error.message);await load();location.hash="#/members"}
function openMarriage(id,pid){
 const rec=id?marriages.find(m=>m.id===id):{person1_id:pid||null,status:"married"};
 openForm(id?"Edit couple":"Add couple",MF,rec,async o=>{
  if(!o.person1_id||!o.person2_id)return"Select both people";
  if(o.person1_id===o.person2_id)return"Choose two different people";
  const r=id?await sb.from("marriages").update(o).eq("id",id):await sb.from("marriages").insert(o);
  if(r.error)return r.error.message;await load()})}
async function delMarriage(id){if(!confirm("Delete this marriage record?"))return;
 const {error}=await sb.from("marriages").delete().eq("id",id);if(error)return alert(error.message);await load()}

/* ---------- login (email OTP; free) ---------- */
function viewLogin(app){
 if(session){app.innerHTML=`<h2>Account</h2><div class="sec">Signed in as <b>${esc(session.user.email||session.user.phone)}</b><br>Access: <b>${role||"pending – ask the admin to approve you"}</b>
  <div class="row"><button id="lo">Sign out</button></div></div>`;
  $("#lo").onclick=async()=>{await sb.auth.signOut();location.hash="#/"};return}
 app.innerHTML=`<h2>Sign in</h2><div class="sec"><div id="lm" class="mut"></div>
  <div id="s1"><label>Email</label><input id="em" type="email" autocomplete="email"><div class="row"><button id="go">Send code</button></div></div>
  <div id="s2" hidden><label>Code from your email</label><input id="cd" inputmode="numeric" autocomplete="one-time-code"><div class="row"><button id="vf">Verify</button></div></div></div>`;
 $("#go").onclick=async()=>{const email=$("#em").value.trim();if(!email)return;
  const {error}=await sb.auth.signInWithOtp({email});
  if(error)return $("#lm").textContent=error.message;
  $("#s1").hidden=true;$("#s2").hidden=false;$("#lm").textContent="Code sent to "+email};
 $("#vf").onclick=async()=>{
  const {error}=await sb.auth.verifyOtp({email:$("#em").value.trim(),token:$("#cd").value.trim(),type:"email"});
  if(error)return $("#lm").textContent=error.message;location.hash="#/"};
 /* Phone OTP (needs a paid SMS provider in Supabase):
    sb.auth.signInWithOtp({phone:"+91XXXXXXXXXX"}) then sb.auth.verifyOtp({phone,token,type:"sms"}) */
}
</script></body></html>

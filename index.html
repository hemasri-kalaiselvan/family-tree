<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#243047;--mut:#65738a;--line:#dbe3ef;--pri:#234e8a;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Noto Sans Tamil","Latha",sans-serif}
a{color:inherit;text-decoration:none}
header{background:var(--pri);color:#fff;position:sticky;top:0;z-index:10}
.top{max-width:1050px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{font-weight:700;font-size:1.15rem;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:.95rem}
nav a.on{background:#ffffff30}
#who{font-size:1.3rem;padding:4px 8px;cursor:pointer;background:none;border:0;color:#fff}
main{max-width:1050px;margin:auto;padding:14px}
h2{margin:.2em 0 .6em}
.mut{color:var(--mut);font-size:.85rem}
.status{padding:10px;background:#e7eef8;border-radius:8px;margin:10px 0}
.warn{background:#fff3cd}
button,.btn{font:inherit;padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;background:var(--pri);color:#fff;cursor:pointer;display:inline-block}
button.alt,.btn.alt{background:#e7eef8;color:var(--pri);border-color:#b8c8e2}
button.red{background:var(--red);border-color:var(--red)}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;margin:10px 0 2px;font-size:.85rem;color:var(--mut)}
/* person card */
.pc{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:120px;max-width:100%;flex:0 1 auto}
.pc:hover{border-color:var(--pri)}
.pc{position:relative}
.pc.hb{padding-left:28px}
.bn{position:absolute;left:6px;top:50%;transform:translateY(-50%);min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:8px;background:var(--pri);color:#fff;font-size:.58rem;font-weight:700;line-height:15px;text-align:center;pointer-events:none}
.pc img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.pc .n{font-weight:600;font-size:.92rem;overflow-wrap:break-word}
.pc .t{font-size:.9rem;color:var(--ink)}
.pc .p{font-size:.8rem;color:var(--mut)}
.nw{white-space:nowrap}
.pc.ph .n{font-weight:400;color:var(--mut)}
/* tree */
.couple{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.couple .heart{color:#c2185b}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.kids{margin-left:14px;border-left:2px solid #c5d2e6;padding-left:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
/* person page */
.hero{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;flex-wrap:wrap}
.hero img{width:110px;height:110px;border-radius:14px;object-fit:cover}
.hero h1{margin:0;font-size:1.4rem}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.sec h3{margin:0 0 8px;font-size:1rem;color:var(--mut)}
.bl{opacity:.55;font-weight:400}
.more>summary{padding:8px 0;color:var(--pri);font-weight:600}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px}
.kv b{color:var(--mut);font-weight:500}
.kv span{overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sub{font-size:.8rem;color:var(--mut);margin-left:4px}
dialog{border:1px solid #cbd5e1;border-radius:14px;width:min(94vw,520px);max-height:90vh;color:var(--ink);padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:480px){.two{grid-template-columns:1fr}.kv{grid-template-columns:105px 1fr}}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}
.pv{width:80px;height:80px;border-radius:12px;object-fit:cover;margin-top:6px}
.mc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.88rem;line-height:1.35}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mh .nm{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.ph{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:#e3e9f3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#8a97ab}
.mc.full .ph{width:84px;height:84px;border-radius:14px;font-size:2.4rem}
.ml{margin-top:2px}.ml b{color:var(--mut);font-weight:600;font-size:.8rem}
.lk{color:var(--pri);font-weight:600}
.chips{display:flex;gap:6px;margin:8px 0}
.chip{padding:5px 14px;border-radius:99px;background:#e7eef8;color:var(--pri);border:1px solid #b8c8e2;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--pri);color:#fff}
.more{display:inline-block;color:var(--pri);font-weight:700;font-size:1.1rem;line-height:1;padding:2px 8px;background:#e7eef8;border-radius:6px;margin-top:4px}
.mc details>summary{display:inline-block;color:var(--pri);font-weight:700;font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 8px;background:#e7eef8;border-radius:6px;margin-top:4px}
.mc .kv{margin-top:6px;font-size:.85rem}
#top{position:fixed;right:14px;bottom:18px;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.3rem;box-shadow:0 2px 8px #0004;z-index:20;display:none}
@media(max-width:600px){.bt{display:none}nav a{padding:8px 10px}}
.sb{position:relative}.sb input{padding-right:40px}
.qc{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);font-size:1.1rem;padding:8px 12px;line-height:1}
.srow{display:flex;gap:8px;align-items:flex-start}.srow .mc{flex:1;min-width:0}
.sc{width:24px;height:24px;margin-top:14px;flex:none}
.bulk{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:25;box-shadow:0 -2px 8px #0002}
.bulk[hidden]{display:none}.bulk b{margin-right:auto;font-size:.95rem}
body.bulkon #top{bottom:82px}body.bulkon main{padding-bottom:90px}
.couple{flex-wrap:nowrap;gap:4px;align-items:stretch}
.couple .heart{flex:none;align-self:center;font-size:.9rem}
.pc{min-width:0;padding:4px 8px;gap:6px;border-radius:10px}
.pc img{width:32px;height:32px}
.pc .n{font-size:.8rem;line-height:1.2}
.pc .p{font-size:.68rem}
.kids{margin-left:10px;padding-left:8px}
.tg{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--pri);font-size:1.15rem;margin-right:8px;cursor:pointer;user-select:none;transition:transform .15s}
.tw[open]>summary .tg{transform:rotate(90deg)}
.pc.cur{border-color:var(--pri);background:#e7eef8}
.hg{margin-top:8px}.hcards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.hcards .pc{min-width:0;max-width:100%}
.hcl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;background:#eef2f9;border-radius:12px;padding:4px 6px;position:relative}
.hcl.cur{background:#dde8f7}
.hl{font-size:.72rem;color:var(--mut);text-align:center;width:100%;display:block}
.hv{height:16px;width:0;border-left:1px solid #b9c6dc;margin:0 auto}
.hgk{margin-top:12px}.hgk>summary{color:var(--pri);font-weight:600;text-align:center}
.hwrap{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding:10px 8px 16px;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:12px}
.hn{display:flex;align-items:center;width:max-content}
.hcp{display:flex;flex-direction:column;gap:1px;width:176px;flex:none}
.hcp .pc{min-width:0;width:100%}
.hcp .pc .p{white-space:nowrap;font-size:.66rem}
.hcp .heart{text-align:center;line-height:.9;font-size:.8rem;position:relative;z-index:1}
.hmore{font-size:.72rem;color:var(--pri);text-align:center;padding:2px 0;font-weight:600}
.hwrap{position:relative}
.hk{display:flex;flex-direction:column;gap:26px;margin-left:104px}
.hc{position:relative;z-index:1}
.hgrp{display:flex;flex-direction:column;gap:20px}
.hlab{font-size:.7rem;font-weight:600;color:var(--mut)}
.hsv{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden;z-index:0}
.hroots{display:flex;flex-direction:column;gap:40px;width:max-content;padding-right:56px}
.hsv.tp{z-index:2}
.hdup{font-size:.7rem;color:var(--mut);text-align:center;margin-top:2px}
</style></head><body>
<header><div class="top">
  <a class="brand" href="#/">🌳<span class="bt"> Family Tree</span></a>
  <nav id="nav"></nav>
  <button id="who" title="Sign in" aria-label="Sign in">👤</button>
</div></header>
<main id="app"><div class="status">Loading…</div></main>
<dialog id="dlg"></dialog>
<button id="top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://wzxouwyhpqqjyxfppzkw.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_J6TXONzH6rGFhM98qEQfAg_V5PEJW5-";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let people=[],marriages=[],session=null,role=null,loadErr="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canEdit=()=>role==="admin";
const P=id=>people.find(p=>p.id===id);

/* ---------- field definitions: [key,label,type,extra] ---------- */
const PF=[
["name","Name","text"],["tree","Family tree","sel",["vetri","rajmohan"]],["nickname","Nickname","text"],
["gender","Gender","sel",["male","female","other"]],
["father_id","Father","person"],["mother_id","Mother","person"],["birth_order","Birth order among siblings","num"],
["dob","Date of birth","date"],["birth_time","Time of birth","time"],["birth_place","Place of birth","text"],
["life_status","Alive / Deceased","sel",["alive","deceased","unknown"]],
["dod","Date of death","date"],["death_place","Place of death","text"],
["education","Education","text"],["profession","Profession","text"],
["current_location","Currently lives in","text"],["native_place","Native place","text"],
["kothram","Kothram","text"],["rasi","Rasi","text"],["natchathiram","Natchathiram","text"],
["phone","Phone","text"],["email","Email","text"],
["facebook","Facebook","text"],["instagram","Instagram","text"],["youtube","YouTube","text"],["twitter","Twitter / X","text"],["linkedin","LinkedIn","text"],["github","GitHub","text"],
["whatsapp","WhatsApp number","text"],["telegram","Telegram","text"],["snapchat","Snapchat","text"],["threads","Threads","text"],["pinterest","Pinterest","text"],["website","Website / blog","text"],["maps_link","Google Maps location link","text"],["alt_phone","Alternate phone","text"],["home_address","Home address","area"],
["blood_group","Blood group","sel",["A+","A-","B+","B-","AB+","AB-","O+","O-"]],
["branch","Family line / branch","text"],
["is_placeholder","Placeholder name (e.g. \"Ravi's son\")","chk"],
["notes","Notes","area"],["photo_url","Photo","photo"]];
const MF=[
["person1_id","Person 1","person"],["person2_id","Person 2","person"],
["status","Status","sel",["engaged","married","separated","divorced","widowed"]],
["engagement_date","Engagement date","date"],["engagement_place","Engagement place","text"],
["marriage_date","Wedding date","date"],["wedding_place","Wedding place","text"],
["end_date","Separation / divorce date","date"],["notes","Notes","area"],["photo_url","Photo","photo"]];

/* ---------- helpers ---------- */
function fmtDate(s){if(!s)return"";let m;
 if(m=s.match(/^--(\d{2})-(\d{2})$/))return`${m[2]}-${m[1]}`;
 if(/^\d{4}$/.test(s))return s;
 if(m=s.match(/^(\d{4})-(\d{2})$/))return`${m[2]}-${m[1]}`;
 if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/))return`${m[3]}-${m[2]}-${m[1]}`;
 return s}
function normTime(v){if(!v)return"";const m=String(v).trim().match(/^(\d{1,2}):(\d{2})\s*([ap]m)?$/i);if(!m)return"";let h=+m[1];const ap=(m[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;return String(h).padStart(2,"0")+":"+m[2]}
function fmtTime(v){const t=normTime(v);if(!t)return String(v||"");let[h,mi]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(mi).padStart(2,"0")+" "+ap}
const isLate=p=>p.is_late??(p.life_status==="deceased"||!!p.dod);
function periodHtml(p){const b=fmtDate(p.dob),d=fmtDate(p.dod),n=x=>`<span class="nw">${esc(x)}</span>`;
 if(b&&d)return`${n(b)} – ${n(d)}`;
 if(b)return isLate(p)?`${n(b)} – ?`:n(b);
 if(d)return`d. ${n(d)}`;return""}
function period(p){const b=fmtDate(p.dob),d=fmtDate(p.dod);
 if(b&&d)return`${b} – ${d}`;
 if(b)return isLate(p)?`${b} – ?`:b;
 if(d)return`d. ${d}`;return""}
const sortKey=p=>dispName(p).replace(/^\s*late\s+/i,"").toLowerCase();
const byName=(a,b)=>sortKey(a).localeCompare(sortKey(b),undefined,{sensitivity:"base"})||a.id-b.id;
const dispName=p=>(isLate(p)?"Late ":"")+(p.name||"Unnamed");
const nm=id=>{const p=P(id);return p?dispName(p):""};
function card(p,o){
 const per=period(p),num=bo(p)!==null&&!(o&&o.nn);
 return`<a class="pc${num?" hb":""}" href="#/person/${p.id}">`+
 (num?`<span class="bn" title="Birth order">${esc(p.birth_order)}</span>`:"")+(p.photo_url?`<img loading="lazy" src="${esc(p.photo_url)}" alt="">`:"")+
 `<div><div class="n">${esc(dispName(p))}</div>`+
 (per?`<div class="p">${periodHtml(p)}</div>`:"")+`</div></a>`}
const cardNN=p=>card(p,{nn:1});
const bo=p=>{const n=Number(p.birth_order);return p.birth_order==null||!isFinite(n)?null:n};
function cmp(a,b){const x=bo(a),y=bo(b);if(x===null&&y===null)return a.id-b.id;if(x===null)return 1;if(y===null)return-1;return x-y||a.id-b.id}
const spouseIds=id=>[...new Set(marriages.filter(m=>m.person1_id===id||m.person2_id===id).map(m=>m.person1_id===id?m.person2_id:m.person1_id))];
const childrenOf=id=>people.filter(c=>c.father_id===id||c.mother_id===id).sort(cmp);
const siblingsOf=p=>people.filter(o=>o.id!==p.id&&((p.father_id&&o.father_id===p.father_id)||(p.mother_id&&o.mother_id===p.mother_id))).sort(cmp);
const links=ps=>ps.length?`<div class="grid">${ps.map(card).join("")}</div>`:`<span class="mut">Not recorded</span>`;

/* ---------- data ---------- */
async function load(){
 loadErr="";
 const {data:{session:s}}=await sb.auth.getSession();session=s;role=null;
 if(s){const r=await sb.from("ft_app_users").select("role").eq("user_id",s.user.id).maybeSingle();role=r.data?.role||null}
 const [a,b]=await Promise.all([sb.rpc("ft_data",{tbl:"ft_people"}),sb.rpc("ft_data",{tbl:"ft_marriages"})]);
 if(a.error||b.error){loadErr=(a.error||b.error).message;people=[];marriages=[]}
 else{people=a.data;marriages=b.data}
 renderNav();route()}
sb.auth.onAuthStateChange(()=>setTimeout(load,0));

/* ---------- nav / routing ---------- */
function renderNav(){
 const h=location.hash.slice(1)||"/";
 const items=[["/vetri","Vetri"],["/raj","Raj"],["/members","Members"]];
 if(canEdit())items.push(["/add","+ Add"]);
 $("#nav").innerHTML=items.map(([u,t])=>`<a href="#${u}" class="${h===u||(u==="/vetri"&&h==="/")||(u==="/members"&&h.startsWith("/person"))?"on":""}">${t}</a>`).join("");
 $("#who").textContent=session?"✅":"👤";
 $("#who").title=session?"Account":"Sign in"}
window.addEventListener("scroll",()=>{$("#top").style.display=scrollY>300?"block":"none"});
window.addEventListener("hashchange",()=>{renderNav();route();window.scrollTo(0,0)});
$("#who").onclick=()=>{location.hash="#/login"};

function route(){
 document.body.classList.remove("bulkon");if(!/^#\/members/.test(location.hash)){selMode=false;sel.clear()}
 if(/error_description=/.test(location.hash)){const m=decodeURIComponent((location.hash.match(/error_description=([^&]*)/)[1]||"").replace(/\+/g," "));$("#app").innerHTML=`<div class="status warn">Sign-in failed: ${esc(m)}<br>Request a new link from 👤 and open it right away.</div>`;return}
 const [,a,b]=(location.hash.slice(1)||"/").split("/");
 const app=$("#app");
 if(a==="login")return viewLogin(app);
 if(loadErr){app.innerHTML=`<div class="status warn">Could not load data: ${esc(loadErr)}<br>Did you run schema.sql in Supabase?</div>`;return}
 if(a==="members")return viewMembers(app);
 if(a==="person")return viewPerson(app,+b);
 if(a==="add"){if(canEdit()){app.innerHTML="";openPerson()}else location.hash="#/login";return}
 if(a==="raj")return viewTree(app,"rajmohan");
 viewTree(app,"vetri")}

/* ---------- Tree (home) ---------- */
let curTree="vetri",lay="horiz",depthN=99,depthV="all";
const fo={},st={};
function fcard(p,cur){
 const per=period(p);
 return`<a class="pc ${cur?"cur":""}" href="javascript:void(0)" onclick="refocus(${p.id})">`+
 (p.photo_url?`<img loading="lazy" src="${esc(p.photo_url)}" alt="">`:"")+
 `<div><div class="n">${esc(dispName(p))}</div>`+(per?`<div class="p">${periodHtml(p)}</div>`:"")+`</div></a>`}
function refocus(id){fo[curTree]=id;window.scrollTo(0,0);window.drawLay&&window.drawLay()}
function hstart(id){st[curTree]=id;window.drawLay&&window.drawLay()}
function hdepth(v){depthV=v;depthN=v==="all"?99:+v;window.drawLay&&window.drawLay()}
const hasPar=p=>p.father_id||p.mother_id;

function viewTree(app,T){
 curTree=T;
 const pool=people.filter(p=>p.tree===T);
 const L=[["tree","Outline"],["hour","Hourglass"],["horiz","Horizontal"]];
 app.innerHTML=`<h2>${T==="rajmohan"?"Raj":"Vetri"} family tree</h2>
 <div class="chips">${L.map(([k,l])=>`<span class="chip ${lay===k?"on":""}" data-l="${k}">${l}</span>`).join("")}<span class="mut" style="margin-left:auto;align-self:center">${pool.length} people</span></div><div id="lb"></div>`;
 const draw=()=>{$("#lb").innerHTML=lay==="tree"?treeHtml(T,pool):lay==="hour"?hourHtml(T,pool):horizHtml(T,pool);if(lay==="horiz")hLines()};
 window.drawLay=draw;
 document.querySelectorAll(".chip[data-l]").forEach(c=>c.onclick=()=>{lay=c.dataset.l;document.querySelectorAll(".chip[data-l]").forEach(x=>x.classList.toggle("on",x===c));draw()});
 draw()}

/* ---- layout 1: indented tree ---- */
function treeHtml(T,pool){
 const shown=new Set();
 function unit(p,depth,path){
  const sps=spouseIds(p.id).map(P).filter(Boolean);
  const ids=[p.id,...sps.map(s=>s.id)];
  const key=c=>Math.max(ids.indexOf(c.father_id),ids.indexOf(c.mother_id));
  ids.forEach(i=>shown.add(i));
  const np=path.concat(ids);
  const kids=people.filter(c=>(ids.includes(c.father_id)||ids.includes(c.mother_id))&&!np.includes(c.id)).sort((x,y)=>key(x)-key(y)||cmp(x,y));
  const couple=`<div class="couple"><span class="tg">${kids.length?"▸":""}</span>${cardNN(p)}${sps.map(s=>`<span class="heart">♥</span>${cardNN(s)}`).join("")}</div>`;
  if(!kids.length)return`<div>${couple}</div>`;
  return`<details class="tw" ${depth<2?"open":""}><summary>${couple}</summary><div class="kids">${kids.map(k=>unit(k,depth+1,np)).join("")}</div></details>`}
 const inlaw=p=>!hasPar(p)&&spouseIds(p.id).some(s=>P(s)&&P(s).tree===T&&hasPar(P(s)));
 const isolated=p=>!hasPar(p)&&!spouseIds(p.id).length&&!childrenOf(p.id).length;
 const roots=pool.filter(p=>!hasPar(p)&&!inlaw(p)&&!isolated(p)).sort((a,b)=>a.id-b.id);
 let html="";
 roots.forEach(r=>{if(!shown.has(r.id))html+=`<div class="sec">${unit(r,0,[])}</div>`});
 const others=pool.filter(isolated);
 return`<div class="mut">Tap a name for the full record · tap ▸ to expand</div>
 <div class="tools"><button class="alt" onclick="document.querySelectorAll('.tw').forEach(d=>d.open=true)">Expand all</button>
 <button class="alt" onclick="document.querySelectorAll('.tw').forEach(d=>d.open=false)">Collapse all</button></div>
 ${html||'<div class="status">No people yet.</div>'}
 ${others.length?`<details class="sec"><summary><b>Not yet linked (${others.length})</b></summary><div class="grid" style="margin-top:8px">${others.map(cardNN).join("")}</div></details>`:""}`}

/* ---- layout 2: hourglass ---- */
function hourHtml(T,pool){
 if(!pool.length)return'<div class="status">No people yet.</div>';
 let f=P(fo[T]);
 if(!f)f=(T==="rajmohan"?people.find(p=>p.name==="Rajmohan"):people.find(p=>p.name==="Vetriselvi"))||pool[0];
 fo[T]=f.id;
 const fa=P(f.father_id),mo=P(f.mother_id);
 const par=x=>x?[P(x.father_id),P(x.mother_id)].filter(Boolean):[];
 const gF=par(fa),gM=par(mo);
 const sps=spouseIds(f.id).map(P).filter(Boolean);
 const ids=[f.id,...sps.map(s=>s.id)];
 const kids=people.filter(c=>ids.includes(c.father_id)||ids.includes(c.mother_id)).sort(cmp);
 const gk=[...new Map(kids.flatMap(c=>childrenOf(c.id)).map(x=>[x.id,x])).values()];
 const cl=(ps,lbl)=>ps.length?`<div class="hcl">${lbl?`<span class="hl">${lbl}</span>`:""}${ps.map(p=>fcard(p)).join('<span class="heart">♥</span>')}</div>`:"";
 const V='<div class="hv"></div>';
 const opts=[...pool,...(pool.includes(f)?[]:[f])].sort(byName);
 let h=`<div class="tools"><select style="max-width:100%" onchange="refocus(+this.value)">${opts.map(p=>`<option value="${p.id}" ${p.id===f.id?"selected":""}>${esc(dispName(p))} (#${p.id})</option>`).join("")}</select></div>
 <div class="mut">Tap anyone to centre the chart on them</div><div class="hg">`;
 if(gF.length||gM.length)h+=`<div class="hcards">${cl(gF,"Father's parents")}${cl(gM,"Mother's parents")}</div>${V}`;
 if(fa||mo)h+=`<div class="hcards">${cl([fa,mo].filter(Boolean),"Parents")}</div>${V}`;
 h+=`<div class="hcards"><div class="hcl cur">${fcard(f,true)}${sps.map(s=>`<span class="heart">♥</span>${fcard(s)}`).join("")}</div></div>
 <div class="hcards" style="margin-top:6px"><a class="btn alt" href="#/person/${f.id}">Open full record ›</a></div>`;
 if(kids.length)h+=`${V}<div class="hl">Children</div><div class="hcards">${kids.map(c=>fcard(c)).join("")}</div>`;
 if(gk.length)h+=`<details class="hgk"><summary>Grandchildren (${gk.length})</summary><div class="hcards" style="margin-top:6px">${gk.map(c=>fcard(c)).join("")}</div></details>`;
 return h+`</div>`}


/* connector lines for the horizontal layout.
   RULES
   1. Spouses shown together (heart between them): the children's line starts at that heart.
   2. Spouses shown in different places: a thick dotted line in its own colour joins them. It is routed around every box
      (never behind one) and never runs along another line (it may only cross). The children's line branches off that dotted
      line right beside the parent who is shown first.
   3. Every vertical line gets its own lane, so two lines never run on top of each other (they may only cross). */
const HCOL=["#d98aa6","#6fa3d6","#7fbf8a","#d4a95f","#a28bd4"];
const LCOL=["#e6194b","#0077b6","#2e9e47","#7b2cbf","#e08a00","#00a6a6","#6d4c41"];
let hRO=null;

/* grid router: orthogonal path from S to E that avoids boxes and prefers not to share a lane with an existing line */
function hRoute(S,E,obst,segs,W,H){
 const g=6;
 for(const m of [[170,120],[600,400]]){
  const xmin=Math.max(0,Math.min(S[0],E[0])-m[0]),xmax=Math.min(W+80,Math.max(S[0],E[0])+m[0]);
  const ymin=Math.max(0,Math.min(S[1],E[1])-m[1]),ymax=Math.min(H+40,Math.max(S[1],E[1])+m[1]);
  const ox=S[0]-g*Math.floor((S[0]-xmin)/g),oy=S[1]-g*Math.floor((S[1]-ymin)/g);
  const cw=Math.ceil((xmax-ox)/g)+1,ch=Math.ceil((ymax-oy)/g)+1,N=cw*ch;
  if(N>1500000)continue;
  const blk=new Uint8Array(N),hO=new Uint8Array(N),vO=new Uint8Array(N);
  const cx=x=>Math.round((x-ox)/g),cy=y=>Math.round((y-oy)/g);
  for(const o of obst){
   if(o.r+4<ox||o.l-4>xmax||o.b+4<oy||o.t-4>ymax)continue;
   const a=Math.max(0,cx(o.l-4)),b=Math.min(cw-1,cx(o.r+4)),c=Math.max(0,cy(o.t-4)),d=Math.min(ch-1,cy(o.b+4));
   for(let y=c;y<=d;y++)for(let x=a;x<=b;x++)blk[y*cw+x]=1}
  for(const[x1,y1,x2,y2]of segs){
   /* 1 = a line is here, 2 = a line is right next to here (keep a clear gap) */
   if(y1===y2){const a=Math.max(0,cx(Math.min(x1,x2))),b=Math.min(cw-1,cx(Math.max(x1,x2))),y=cy(y1);if(y<0||y>=ch)continue;
    for(let x=a;x<=b;x++){hO[y*cw+x]=1;for(const dy of[-2,-1,1,2]){const yy=y+dy;if(yy>=0&&yy<ch&&!hO[yy*cw+x])hO[yy*cw+x]=2}}}
   else{const a=Math.max(0,cy(Math.min(y1,y2))),b=Math.min(ch-1,cy(Math.max(y1,y2))),x=cx(x1);if(x<0||x>=cw)continue;
    for(let y=a;y<=b;y++){vO[y*cw+x]=1;for(const dx of[-2,-1,1,2]){const xx=x+dx;if(xx>=0&&xx<cw&&!vO[y*cw+xx])vO[y*cw+xx]=2}}}}
  const sx=cx(S[0]),sy=cy(S[1]),ex=cx(E[0]),ey=cy(E[1]);
  if(sx<0||sy<0||sx>=cw||sy>=ch||ex<0||ey<0||ex>=cw||ey>=ch)continue;
  for(const[px,py]of[[sx,sy],[ex,ey]])for(let y=py-1;y<=py+1;y++)for(let x=px-1;x<=px+1;x++)if(x>=0&&y>=0&&x<cw&&y<ch)blk[y*cw+x]=0;
  const dist=new Float32Array(N*4).fill(1e9),prev=new Int32Array(N*4).fill(-1);
  const hp=[],push=(f,s)=>{hp.push([f,s]);let i=hp.length-1;while(i>0){const p=(i-1)>>1;if(hp[p][0]<=hp[i][0])break;[hp[p],hp[i]]=[hp[i],hp[p]];i=p}};
  const pop=()=>{const t=hp[0],l=hp.pop();if(hp.length){hp[0]=l;let i=0;for(;;){let a=2*i+1,b=a+1,m=i;if(a<hp.length&&hp[a][0]<hp[m][0])m=a;if(b<hp.length&&hp[b][0]<hp[m][0])m=b;if(m===i)break;[hp[m],hp[i]]=[hp[i],hp[m]];i=m}}return t};
  const DX=[1,0,-1,0],DY=[0,1,0,-1];
  const s0=(sy*cw+sx)*4;dist[s0]=0;push(Math.abs(ex-sx)+Math.abs(ey-sy),s0);
  let goal=-1,steps=0;
  while(hp.length&&steps++<900000){
   const[,s]=pop(),d=s&3,c=s>>2,x=c%cw,y=(c-x)/cw,gd=dist[s];
   if(x===ex&&y===ey){goal=s;break}
   for(let nd=0;nd<4;nd++){
    if(((nd+2)&3)===d)continue;
    const nx=x+DX[nd],ny=y+DY[nd];if(nx<0||ny<0||nx>=cw||ny>=ch)continue;
    const nc=ny*cw+nx;if(blk[nc])continue;
    let cost=1+(nd!==d?5:0);
    if(nd&1){if(vO[nc]===1)cost+=40;else if(vO[nc]===2)cost+=14;else if(hO[nc]===1)cost+=3}
    else{if(hO[nc]===1)cost+=40;else if(hO[nc]===2)cost+=14;else if(vO[nc]===1)cost+=3}
    const ns=nc*4+nd,nv=gd+cost;
    if(nv<dist[ns]){dist[ns]=nv;prev[ns]=s;push(nv+Math.abs(ex-nx)+Math.abs(ey-ny),ns)}}}
  if(goal<0)continue;
  const pts=[];for(let s=goal;s>=0;s=prev[s]){const c=s>>2,x=c%cw;pts.push([ox+x*g,oy+((c-x)/cw)*g])}
  pts.reverse();
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const a=out[out.length-1],b=pts[i],c=pts[i+1];if((a[0]===b[0]&&b[0]===c[0])||(a[1]===b[1]&&b[1]===c[1]))continue;out.push(b)}
  out.push(pts[pts.length-1]);
  return out}
 return null}

function hLines(){
 const w=document.querySelector(".hwrap");if(!w)return;
 let busy=0,sig="";
 const draw=()=>{
  busy=0;
  const root=w.querySelector(":scope > .hroots");if(!root)return;
  const nsig=root.offsetWidth+"x"+root.offsetHeight+"|"+w.clientWidth;
  if(nsig===sig&&w.querySelector("svg.hsv"))return;
  sig=nsig;
  w.querySelectorAll("svg.hsv").forEach(e=>e.remove());
  const wr=w.getBoundingClientRect(),W=Math.ceil(w.scrollWidth),H=Math.ceil(w.scrollHeight);
  const R=el=>{const r=el.getBoundingClientRect(),l=r.left-wr.left-w.clientLeft+w.scrollLeft,t=r.top-wr.top-w.clientTop+w.scrollTop;
   return{l,t,r:l+r.width,b:t+r.height,cx:l+r.width/2,cy:t+r.height/2}};
  const C=new Map(),obst=[];
  w.querySelectorAll(".hc .pc").forEach(e=>{const r=R(e);C.set(e.parentElement.dataset.c,r);obst.push(r)});
  w.querySelectorAll(".hmore,.hlab,.hdup").forEach(e=>obst.push(R(e)));
  const key=(a,b)=>(+a<+b)?a+"-"+b:b+"-"+a;
  /* lane allocator for the children's vertical lines */
  const lanes={};
  const lane=(k,lo,hi)=>{const L=lanes[k]||(lanes[k]=[]);
   for(let i=0;i<L.length;i++)if(!L[i].some(([a,b])=>lo<b+7&&hi>a-7)){L[i].push([lo,hi]);return i}
   L.push([[lo,hi]]);return L.length-1};
  const out=[],top=[],segs=[],links={},portN={};
  /* 12 clearly different colours; two dotted lines that run near each other never share one */
  const PAL=["#e6194b","#0077b6","#f58231","#7b2cbf","#2e9e47","#d81b9a","#6d4c41","#b8a000","#00a6a6","#303f9f","#ff6f91","#546e7a"];
  const sd=(px,py,s)=>{const dx=Math.max(Math.min(s[0],s[2])-px,0,px-Math.max(s[0],s[2])),dy=Math.max(Math.min(s[1],s[3])-py,0,py-Math.max(s[1],s[3]));return Math.hypot(dx,dy)};
  const clear=(px,py,skip)=>{let m=1e9;for(const s of segs){if(skip&&s[4]===skip)continue;const d=sd(px,py,s);if(d<m)m=d}return m};
  const samples=(pts,step,maxd)=>{const o=[];let d=0;
   for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);if(!L)continue;
    const vert=a[0]===b[0]&&a[1]!==b[1];
    for(let t=0;t<=L;t+=step)o.push({x:a[0]+(b[0]-a[0])*t/L,y:a[1]+(b[1]-a[1])*t/L,vert,cd:Math.min(t,L-t),d:d+t});
    d+=L;if(d>maxd)break}
   return o};
  /* A) dotted couple lines: fix the two ports first (right edge of each box) */
  (w.dataset.pairs||"").split(",").filter(Boolean).forEach(k=>{
   const [a,b]=k.split("-"),A=C.get(a),B=C.get(b),ca=w.querySelector(`.hc[data-c="${a}"] .pc`),cb=w.querySelector(`.hc[data-c="${b}"] .pc`);
   if(!A||!B||ca.closest(".hcp")===cb.closest(".hcp"))return;
   const idx=Object.keys(links).length;   /* every couple line leaves its box at its own distance, so it never starts on another line */
   const port=(id,r)=>{const n=portN[id]=(portN[id]||0)+1,y=Math.max(r.t+8,r.t+(r.b-r.t)*.8-6*(n-1));return{x0:r.r,y,jx:r.r+9+9*(idx%5)}};
   links[k]={ends:{[a]:port(a,A),[b]:port(b,B)},a,b,key:k,col:PAL[0],used:{},pts:null,ok:false,segs:[]}});
  /* B) children lines */
  const GI=[...w.querySelectorAll(".hgrp")].map((g,idx)=>{
   const from=g.dataset.from,other=g.dataset.other,sc=C.get(from);if(!sc)return null;
   const ks=[...g.querySelectorAll(":scope > .hkid")].map(k=>C.get(k.querySelector(".hc").dataset.c)).filter(Boolean);
   if(!ks.length)return null;
   return{g,idx,from,other,sc,ks,kx:Math.min(...ks.map(r=>r.l)),ys:ks.map(r=>r.cy),lk:other?links[key(from,other)]:null,
    col:g.dataset.multi==="1"?HCOL[+g.dataset.gi%HCOL.length]:"#b9c6dc"}}).filter(Boolean);
  const kidLine=(o,sx,sy,col,sw)=>{
   const lo=Math.min(sy,...o.ys),hi=Math.max(sy,...o.ys),i=lane("b"+Math.round(o.kx),lo,hi),bus=o.kx-9-7*(i%5),own="K"+o.idx;
   let p=`M${sx} ${sy}H${bus}`;segs.push([sx,sy,bus,sy,own]);
   if(hi>lo){p+=`M${bus} ${lo}V${hi}`;segs.push([bus,lo,bus,hi,own])}
   o.ks.forEach((r,j)=>{p+=`M${bus} ${o.ys[j]}H${r.l}`;segs.push([bus,o.ys[j],r.l,o.ys[j],own])});
   out.push(`<path d="${p}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"/>`)};
  GI.forEach(o=>{
   if(o.lk)return;                                         /* those start on their dotted line (step E) */
   const ht=o.g.dataset.heart==="1"?w.querySelector(`.heart[data-h="${o.from}"]`):null;
   if(ht){const h=R(ht);kidLine(o,h.cx+7,h.cy,o.col,1.6)}  /* married side by side: start at the heart */
   else kidLine(o,o.sc.r,o.sc.cy,o.col,1.6)});
  /* C) route the dotted lines around the boxes */
  Object.values(links).forEach(lk=>{
   const ea=lk.ends[lk.a],eb=lk.ends[lk.b];
   let mid=hRoute([ea.jx,ea.y],[eb.jx,eb.y],obst,segs,W,H);lk.ok=!!mid;
   if(!mid)mid=[[ea.jx,ea.y],[Math.max(ea.jx,eb.jx)+30,ea.y],[Math.max(ea.jx,eb.jx)+30,eb.y],[eb.jx,eb.y]];
   lk.pts=[[ea.x0,ea.y],...mid,[eb.x0,eb.y]];
   for(let i=1;i<lk.pts.length;i++){const p=lk.pts[i-1],q=lk.pts[i],sg=[p[0],p[1],q[0],q[1],"L"+lk.key];segs.push(sg);lk.segs.push(sg)}});
  /* D) colours: lines that come near each other get different colours */
  const LK=Object.values(links);
  const sdist=(s,t)=>Math.hypot(Math.max(Math.min(s[0],s[2])-Math.max(t[0],t[2]),Math.min(t[0],t[2])-Math.max(s[0],s[2]),0),Math.max(Math.min(s[1],s[3])-Math.max(t[1],t[3]),Math.min(t[1],t[3])-Math.max(s[1],s[3]),0));
  const nb=new Map(LK.map(l=>[l,new Set()]));
  LK.forEach(x=>LK.forEach(y=>{if(x!==y&&x.segs.some(s=>y.segs.some(t=>sdist(s,t)<70))){nb.get(x).add(y);nb.get(y).add(x)}}));
  [...LK].sort((x,y)=>nb.get(y).size-nb.get(x).size).forEach((l,i)=>{
   const near=new Set([...nb.get(l)].map(n=>n.colSet&&n.col)),all=new Set(LK.map(n=>n.colSet&&n.col));
   /* a colour nobody uses yet if there is one, otherwise one that no nearby line uses */
   l.col=PAL.find(c=>!all.has(c))||PAL.find(c=>!near.has(c))||PAL[i%PAL.length];l.colSet=1});
  /* E) children lines of dotted couples: the big dot goes on the dotted line, close to the parent shown first,
        on a spot where no other line touches */
  const dots=[];
  GI.filter(o=>o.lk).forEach(o=>{
   const lk=o.lk,pts=o.from===lk.a?lk.pts:lk.pts.slice().reverse(),ex=lk.ends[o.from];
   const bus0=o.kx-9,cand=samples(pts,4,900).filter(p=>p.vert&&p.cd>=12&&p.d>=14);
   const rayOk=p=>{const x1=Math.min(p.x,bus0),x2=Math.max(p.x,bus0);
    if(obst.some(r=>r.t-3<p.y&&r.b+3>p.y&&r.r+3>x1&&r.l-3<x2))return false;
    return !segs.some(s=>s[4]!=="L"+lk.key&&s[1]===s[3]&&Math.abs(s[1]-p.y)<6&&Math.max(s[0],s[2])>x1&&Math.min(s[0],s[2])<x2)};
   let J=null;
   for(const need of[17,13,9,5]){
    J=cand.find(p=>rayOk(p)&&clear(p.x,p.y,"L"+lk.key)>=need&&dots.every(d=>Math.hypot(d[0]-p.x,d[1]-p.y)>=18));
    if(J)break}
   const jx=J?J.x:ex.jx,jy=J?J.y:ex.y;
   dots.push([jx,jy]);lk.used[o.from]=[jx,jy];
   kidLine(o,jx,jy,lk.col,2.2)});
  /* F) draw the dotted lines with one little heart near EACH spouse */
  const hearts=[];
  LK.forEach(lk=>{
   const tgt=lk.ok?out:top;
   tgt.push(`<path d="M${lk.pts.map(p=>p[0]+" "+p[1]).join("L")}" fill="none" stroke="${lk.col}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 7"/>`);
   [lk.a,lk.b].forEach((id,n)=>{
    const pts=n?lk.pts.slice().reverse():lk.pts,cand=samples(pts,4,400).filter(p=>p.d>=22&&p.cd>=10);
    let H1=null;
    for(const need of[14,11,8,5]){
     H1=cand.find(p=>clear(p.x,p.y,"L"+lk.key)>=need&&dots.every(d=>Math.hypot(d[0]-p.x,d[1]-p.y)>=20)&&hearts.every(h=>Math.hypot(h[0]-p.x,h[1]-p.y)>=22));
     if(H1)break}
    if(!H1)H1=cand[0]||samples(pts,4,60)[3]||{x:pts[0][0],y:pts[0][1]};
    hearts.push([H1.x,H1.y,lk.col])});
   if(lk.used){Object.values(lk.used).forEach(([x,y])=>tgt.push(`<circle cx="${x}" cy="${y}" r="4.5" fill="${lk.col}"/>`))}});
  hearts.forEach(([x,y,c])=>out.push(`<circle cx="${x}" cy="${y}" r="7" fill="#fff"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="13" fill="${c}">♥</text>`));
  const svg=cl=>`<svg class="hsv ${cl}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  w.insertAdjacentHTML("afterbegin",svg("")+out.join("")+"</svg>");
  if(top.length)w.insertAdjacentHTML("beforeend",svg("tp")+top.join("")+"</svg>")};
 const sched=()=>{if(busy)return;busy=1;setTimeout(()=>requestAnimationFrame(draw),150)};
 requestAnimationFrame(draw);
 if(hRO)hRO.disconnect();
 const root=w.querySelector(":scope > .hroots");
 if(root&&window.ResizeObserver){hRO=new ResizeObserver(sched);hRO.observe(root)}}

/* ---- layout 3: horizontal descendants ---- */
function horizHtml(T,pool){
 if(!pool.length)return'<div class="status">No people yet.</div>';
 const inlaw=p=>!hasPar(p)&&spouseIds(p.id).some(s=>P(s)&&P(s).tree===T&&hasPar(P(s)));
 const hasKids=p=>childrenOf(p.id).length>0||spouseIds(p.id).some(s=>childrenOf(s).length>0);
 const roots=pool.filter(p=>!hasPar(p)&&!inlaw(p)&&hasKids(p)).sort((a,b)=>a.id-b.id);
 /* start: the whole tree (default) or one chosen person */
 const sv=st[T],whole=sv===undefined||sv==="all"||!P(sv);
 let starts=[];
 if(whole){roots.forEach(r=>{if(!spouseIds(r.id).some(s=>starts.includes(s)))starts.push(r.id)});if(!starts.length)starts=[pool[0].id];st[T]="all"}
 else starts=[sv];
 /* 1. who is in the chart (by generation); 'home' = the parent under whom each child is placed, so everyone appears once */
 const feeds=x=>[x,...spouseIds(x).filter(i=>P(i)&&!hasPar(P(i)))];
 const depth=new Map(),home=new Map(),q=[];
 starts.forEach(id=>{depth.set(id,1);q.push(id)});
 while(q.length){const x=q.shift(),dx=depth.get(x);if(dx>=depthN)continue;
  feeds(x).forEach(i=>childrenOf(i).forEach(c=>{if(!depth.has(c.id)){depth.set(c.id,dx+1);home.set(c.id,x);q.push(c.id)}}))}
 /* 2. build the placement tree */
 let placed,pairs,nodes;
 const pk=(a,b)=>a<b?a+"-"+b:b+"-"+a;
 const grpKey=(p,ids,c)=>{
  const pars=[c.father_id,c.mother_id].filter(Boolean);
  const shown=i=>P(i)&&(depth.has(i)||placed.has(i));
  if(pars.includes(p.id)){
   const o=pars.find(i=>i!==p.id);
   if(o==null)return"s";
   if(ids.includes(o))return"c"+o;
   return shown(o)?"l"+o:"s"}
  /* child of a spouse who stands in this stack: the line belongs to THAT spouse and to the other parent (the right wife / husband) */
  const sp=pars.find(i=>ids.includes(i)),o=pars.find(i=>i!==sp);
  if(sp==null)return"s";
  if(o==null)return"c"+sp;
  if(ids.includes(o))return"c"+sp;
  return shown(o)?"m"+sp+":"+o:"c"+sp};
 function build(p){
  placed.add(p.id);
  const sps=spouseIds(p.id).map(P).filter(s=>s&&!depth.has(s.id)&&!placed.has(s.id));
  sps.forEach(s=>placed.add(s.id));
  const ids=[p.id,...sps.map(s=>s.id)];
  spouseIds(p.id).forEach(s=>{if(P(s)&&!ids.includes(s)&&(depth.has(s)||placed.has(s)))pairs.add(pk(p.id,s))});
  const homed=people.filter(c=>home.get(c.id)===p.id&&!placed.has(c.id));
  const gs=new Map();
  homed.forEach(c=>{const k=grpKey(p,ids,c);if(!gs.has(k))gs.set(k,[]);gs.get(k).push(c)});
  const ord=k=>k==="s"?0:k[0]==="c"?1+ids.indexOf(+k.slice(1)):100;
  const groups=[...gs.entries()].sort((x,y)=>ord(x[0])-ord(y[0])).map(([k,g])=>{
   if(k[0]==="l")pairs.add(pk(p.id,+k.slice(1)));
   if(k[0]==="m"){const[a,b]=k.slice(1).split(":").map(Number);pairs.add(pk(a,b))}

 const make=()=>{placed=new Set();pairs=new Set();nodes=new Map();return starts.map(id=>build(P(id)))};
 /* 2b. kids of spouses who are shown in different places are placed beside the UPPER spouse,
    so the children's line stays short (repeat a couple of times until stable) */
 const rehome=ts=>{

  ts.forEach(walk);

   const c=P(cid);if(!c)return;
   const ps=[c.father_id,c.mother_id].filter(i=>i&&ypos.has(i));
   if(ps.length<2)return;
   const [u,v]=ps;if(Math.abs(ypos.get(u)-ypos.get(v))<0.01)return;
   const up=ypos.get(u)<ypos.get(v)?u:v,ow=owner(up);
   if(ow!=null&&ow!==h0&&ow!==cid&&ypos.has(ow)){home.set(cid,ow);ch=true}});
  return ch};

 for(let it=0;it<3;it++){trees=make();if(!rehome(trees))break}
 trees=make();
 /* 2c. safety net: anybody who is in the chart's family but did not get a place is attached under a parent */
 for(let pass=0;pass<4;pass++){
  const miss=[...depth.keys()].filter(id=>!placed.has(id)&&P(id));if(!miss.length)break;
  miss.forEach(id=>{if(placed.has(id))return;
   const c=P(id),par=[c.father_id,c.mother_id].map(i=>nodes.get(i)).find(Boolean),nd=build(c);
   if(par){let g=par.groups.find(x=>x.k==="s");if(!g){g={k:"s",kids:[]};par.groups.unshift(g)}g.kids.push(nd)}else trees.push(nd)})}

 const hc=(p,num)=>`<div class="hc" data-c="${p.id}">${card(p,num?undefined:{nn:1})}</div>`;

  const stack=`<div class="hcp">${hc(n.p,num)}${n.sps.map(s=>`<span class="heart" data-h="${s.id}">♥</span>${hc(s,false)}`).join("")}${hid?`<a class="hmore" href="javascript:void(0)" onclick="hstart(${n.p.id})">${hid} ${hid>1?"children":"child"} ▸</a>`:""}</div>`;

 const cand=people.filter(hasKids).sort(byName);
 if(!whole&&!cand.includes(P(starts[0])))cand.unshift(P(starts[0]));
 const unlinked=whole?pool.filter(p=>!placed.has(p.id)):[];
 return`<div class="tools"><select style="flex:1;min-width:0" onchange="hstart(this.value==='all'?'all':+this.value)"><option value="all" ${whole?"selected":""}>Whole tree (everyone)</option>${cand.map(p=>`<option value="${p.id}" ${!whole&&p.id===starts[0]?"selected":""}>${esc(dispName(p))} (#${p.id})</option>`).join("")}</select>
 <select style="width:auto" onchange="hdepth(this.value)">${["2","3","4","5","all"].map(v=>`<option value="${v}" ${depthV===v?"selected":""}>${v==="all"?"All levels":v+" levels"}</option>`).join("")}</select></div>

  <div class="row"><button id="go">Sign in</button></div>

 const go=async()=>{const u=$("#ui").value,p=$("#pw").value;if(!u||!p)return;
  $("#go").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:uid2mail(u),password:p});
  $("#go").disabled=false;
  if(error)return $("#lm").textContent="Wrong user ID or password";
  location.hash="#/"};
 $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()}}
